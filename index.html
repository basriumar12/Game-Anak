<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alphabet Racing Adventure — Game Balap Edukasi Alfabet A-Z</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       STYLE ALPHABET RACING ADVENTURE (MOBILE-FIRST, PORTRAIT, RETINA READY)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      background: #0f172a;
      touch-action: none;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #22c55e;
      display: flex;
      flex-direction: column;
    }

    /* Canvas Balapan Utama */
    #race-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 5;
    }

    /* ================= 1. TOP HUD (STATUS & AUDIO) ================= */
    .top-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 12px) 16px 8px;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }

    .hud-circle-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #ffffff;
      border: 3.5px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25), inset 0 -3px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s ease;
    }
    .hud-circle-btn:active { transform: scale(0.9); }
    .btn-home { border-color: #f59e0b; background: #fef08a; }
    .btn-speaker { border-color: #10b981; background: #bbf7d0; animation: pulseSpeaker 1.8s infinite alternate ease-in-out; }
    .btn-pause { border-color: #6366f1; background: #e0e7ff; }

    @keyframes pulseSpeaker {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* Progress Checkpoint & Score */
    .checkpoint-badge {
      background: rgba(255, 255, 255, 0.95);
      border: 3.5px solid #f59e0b;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
      color: #b45309;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
      pointer-events: auto;
    }

    /* ================= 2. KONTROL SETIR HP BAWAH ================= */
    .bottom-controls-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px env(safe-area-inset-bottom, 20px);
      pointer-events: none;
    }

    .steering-btn {
      pointer-events: auto;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      border: 5px solid #ffffff;
      color: #ffffff;
      font-size: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.45), inset 0 -5px 0 #0369a1;
      transition: transform 0.08s ease, background 0.1s;
    }
    .steering-btn:active {
      transform: scale(0.9);
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    }

    /* ================= 3. OVERLAY KUIS DI CHECKPOINT GERBANG ================= */
    #question-card-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 70;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .question-modal-box {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%);
      border: 6px solid #22c55e;
      border-radius: 36px;
      padding: 22px 18px 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: popCard 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popCard {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Banner Pertanyaan Suara */
    .question-banner-pill {
      width: 100%;
      background: #ffffff;
      border: 3.5px solid #38bdf8;
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.12);
    }
    .question-banner-pill:active { transform: scale(0.98); }

    .q-speaker-icon {
      font-size: 32px;
      line-height: 1;
      animation: pulseSpeaker 1.6s infinite alternate;
    }

    .q-text-prompt {
      flex: 1;
      font-size: 17px;
      font-weight: 800;
      color: #0369a1;
      line-height: 1.25;
    }

    /* Tiga Pilihan Huruf Kartu Besar */
    .choices-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
    }

    .choice-card-btn {
      aspect-ratio: 1;
      background: #ffffff;
      border: 4.5px solid #38bdf8;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(2, 132, 199, 0.22), inset 0 -4px 0 #bae6fd;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }
    .choice-card-btn:active {
      transform: scale(0.92);
    }

    .choice-char {
      font-size: 52px;
      font-weight: 800;
      color: #0284c7;
      line-height: 1;
    }

    .choice-word-hint {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      margin-top: 4px;
    }

    /* Animasi Salah Lembut & Benar */
    .card-shake-soft {
      animation: shakeCard 0.4s ease-in-out;
      border-color: #f59e0b !important;
    }
    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .card-correct-pop {
      animation: correctPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-color: #22c55e !important;
      background: #dcfce7 !important;
    }
    @keyframes correctPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Status Gerbang Info */
    .gate-lock-info {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ================= 4. LAYAR AWAL / MENU UTAMA ================= */
    #main-menu-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #ffffff;
    }

    .menu-trophy-car {
      font-size: 80px;
      animation: floatCar 2s infinite ease-in-out;
      margin-bottom: 8px;
    }
    @keyframes floatCar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .game-main-title {
      font-size: 30px;
      font-weight: 800;
      text-shadow: 0 4px 10px rgba(0,0,0,0.3);
      line-height: 1.15;
    }

    .game-main-subtitle {
      font-size: 16px;
      font-weight: 600;
      margin-top: 6px;
      opacity: 0.95;
      margin-bottom: 24px;
    }

    /* Pilihan Mobil */
    .car-select-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .car-palette-dock {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .car-option-btn {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: #ffffff;
      border: 4px solid #bae6fd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.2);
      transition: transform 0.1s ease, border-color 0.15s ease;
    }
    .car-option-btn:active { transform: scale(0.92); }
    .car-option-btn.selected {
      border-color: #f59e0b;
      background: #fef08a;
      transform: scale(1.1);
    }

    /* Tombol Mulai Balapan Besar */
    .btn-start-race-huge {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #ffffff;
      border: 5px solid #ffffff;
      border-radius: 40px;
      padding: 16px 48px;
      font-size: 24px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(22, 163, 74, 0.5), inset 0 -5px 0 #15803d;
      animation: pulseStartBtn 1.8s infinite ease-in-out;
    }
    @keyframes pulseStartBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .btn-start-race-huge:active { transform: scale(0.96); }

    /* ================= 5. LAYAR KEMENANGAN AKHIR FINIS ================= */
    #victory-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 120;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.95) 100%);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #ffffff;
    }

    .trophy-huge-icon {
      font-size: 96px;
      animation: trophyPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes trophyPop {
      0% { transform: scale(0); }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .btn-restart-game {
      margin-top: 24px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      border: 4px solid #ffffff;
      border-radius: 36px;
      padding: 14px 42px;
      font-size: 22px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
    }
    .btn-restart-game:active { transform: scale(0.95); }

    /* Utilitas */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app-container">
    
    <!-- 1. Top HUD Header -->
    <header class="top-hud">
      <div class="hud-group">
        <button id="btn-home" class="hud-circle-btn btn-home" aria-label="Menu Utama" title="Menu Utama">🏠</button>
        <button id="btn-repeat-voice" class="hud-circle-btn btn-speaker" aria-label="Ulangi Suara" title="Ulangi Pertanyaan">🔊</button>
      </div>

      <div class="hud-group">
        <div class="checkpoint-badge">
          <span>🏁</span>
          <span id="checkpoint-label">Gerbang A (1/26)</span>
          <span>⭐</span>
          <span id="star-score-label">0</span>
        </div>
      </div>
    </header>

    <!-- 2. Canvas Animasi Balap Mobil & Lintasan 3 Jalur -->
    <canvas id="race-canvas"></canvas>

    <!-- 3. Tombol Kemudi Sentuh Layar HP (Kiri & Kanan) -->
    <div class="bottom-controls-layer">
      <button id="btn-steer-left" class="steering-btn" aria-label="Geser Kiri" title="Geser Kiri">⬅️</button>
      <button id="btn-steer-right" class="steering-btn" aria-label="Geser Kanan" title="Geser Kanan">➡️</button>
    </div>

    <!-- 4. Overlay Panel Pertanyaan Alfabet di Checkpoint -->
    <div id="question-card-overlay" class="hidden">
      <div class="question-modal-box">
        <!-- Banner Suara Pertanyaan -->
        <div id="btn-voice-prompt-box" class="question-banner-pill" title="Sentuh untuk mengulang suara">
          <span class="q-speaker-icon">🔊</span>
          <span id="question-prompt-text" class="q-text-prompt">Ayo cari huruf A!</span>
        </div>

        <!-- Tiga Pilihan Huruf Kartun -->
        <div id="choices-container" class="choices-row">
          <!-- Render Tombol Pilihan Jawaban Dinamis -->
        </div>

        <!-- Info Gerbang Terkunci -->
        <div class="gate-lock-info">
          <span>🔒</span>
          <span>Pilih huruf yang benar untuk membuka gerbang balap!</span>
        </div>
      </div>
    </div>

    <!-- 5. Layar Pilihan Menu Utama & Mobil -->
    <div id="main-menu-screen">
      <div class="menu-trophy-car">🏎️</div>
      <h1 class="game-main-title">Alphabet Racing<br>Adventure</h1>
      <p class="game-main-subtitle">Belajar Huruf A sampai Z Sambil Balapan Ceria</p>

      <p class="car-select-title">Pilih Mobil Favoritmu:</p>
      <div class="car-palette-dock">
        <button class="car-option-btn selected" data-car="red" title="Mobil Merah">🏎️</button>
        <button class="car-option-btn" data-car="blue" title="Mobil Biru">🚙</button>
        <button class="car-option-btn" data-car="yellow" title="Taksi Kuning">🚖</button>
        <button class="car-option-btn" data-car="green" title="Mobil Hijau">🚗</button>
      </div>

      <button id="btn-start-race" class="btn-start-race-huge">MULAI BALAPAN! ▶️</button>
    </div>

    <!-- 6. Layar Kemenangan Finis 26 Huruf Selesai -->
    <div id="victory-screen" class="hidden">
      <div class="trophy-huge-icon">🏆✨</div>
      <h2 style="font-size: 32px; font-weight: 800; color: #facc15; margin-top: 14px;">SELAMAT JUARA!</h2>
      <p id="victory-sub-text" style="font-size: 17px; font-weight: 600; opacity: 0.95; margin-top: 8px;">
        Kamu berhasil menyelesaikan 26 gerbang alfabet A sampai Z!
      </p>
      <button id="btn-restart-race" class="btn-restart-game">MAIN LAGI! 🔄</button>
    </div>

  </div>

  <!-- ==========================================================================
       LOGIKA GAME ENGINE VANILLA JS LENGKAP: STATE MACHINE & VOICE-FIRST
       ========================================================================== -->
  <script>
    (function() {
      'use strict';

      // ----------------------------------------------------------------------
      // 1. DATA MASTER 26 HURUF ALFABET A–Z LENGKAP
      // ----------------------------------------------------------------------
      const ALPHABET_CHECKPOINTS = [
        { letter: 'A', word: 'Apel', emoji: '🍎', prompt: 'Ayo cari huruf A! A seperti Apel merah!' },
        { letter: 'B', word: 'Bola', emoji: '⚽', prompt: 'Ayo cari huruf B! B seperti Bola bundar!' },
        { letter: 'C', word: 'Ceri', emoji: '🍒', prompt: 'Ayo cari huruf C! C seperti Ceri manis!' },
        { letter: 'D', word: 'Donat', emoji: '🍩', prompt: 'Ayo cari huruf D! D seperti Donat lezat!' },
        { letter: 'E', word: 'Elang', emoji: '🦅', prompt: 'Ayo cari huruf E! E seperti Elang gagah!' },
        { letter: 'F', word: 'Flamingo', emoji: '🦩', prompt: 'Ayo cari huruf F! F seperti Flamingo anggun!' },
        { letter: 'G', word: 'Gajah', emoji: '🐘', prompt: 'Ayo cari huruf G! G seperti Gajah besar!' },
        { letter: 'H', word: 'Harimau', emoji: '🐯', prompt: 'Ayo cari huruf H! H seperti Harimau ceria!' },
        { letter: 'I', word: 'Ikan', emoji: '🐟', prompt: 'Ayo cari huruf I! I seperti Ikan berenang!' },
        { letter: 'J', word: 'Jerapah', emoji: '🦒', prompt: 'Ayo cari huruf J! J seperti Jerapah tinggi!' },
        { letter: 'K', word: 'Kelinci', emoji: '🐰', prompt: 'Ayo cari huruf K! K seperti Kelinci melompat!' },
        { letter: 'L', word: 'Lemon', emoji: '🍋', prompt: 'Ayo cari huruf L! L seperti Lemon segar!' },
        { letter: 'M', word: 'Monyet', emoji: '🐵', prompt: 'Ayo cari huruf M! M seperti Monyet lucu!' },
        { letter: 'N', word: 'Nanas', emoji: '🍍', prompt: 'Ayo cari huruf N! N seperti Nanas manis!' },
        { letter: 'O', word: 'Orangutan', emoji: '🦧', prompt: 'Ayo cari huruf O! O seperti Orangutan!' },
        { letter: 'P', word: 'Pisang', emoji: '🍌', prompt: 'Ayo cari huruf P! P seperti Pisang kuning!' },
        { letter: 'Q', word: 'Quran', emoji: '📖', prompt: 'Ayo cari huruf Q! Huruf Q yang rapi!' },
        { letter: 'R', word: 'Rusa', emoji: '🦌', prompt: 'Ayo cari huruf R! R seperti Rusa lincah!' },
        { letter: 'S', word: 'Singa', emoji: '🦁', prompt: 'Ayo cari huruf S! S seperti Singa pemberani!' },
        { letter: 'T', word: 'Topi', emoji: '🧢', prompt: 'Ayo cari huruf T! T seperti Topi keren!' },
        { letter: 'U', word: 'Udang', emoji: '🦐', prompt: 'Ayo cari huruf U! U seperti Udang laut!' },
        { letter: 'V', word: 'Vas', emoji: '🏺', prompt: 'Ayo cari huruf V! V seperti Vas bunga cantik!' },
        { letter: 'W', word: 'Wortel', emoji: '🥕', prompt: 'Ayo cari huruf W! W seperti Wortel oranye!' },
        { letter: 'X', word: 'Xilofon', emoji: '🎵', prompt: 'Ayo cari huruf X! X seperti Xilofon merdu!' },
        { letter: 'Y', word: 'Yoyo', emoji: '🪀', prompt: 'Ayo cari huruf Y! Y seperti Yoyo berputar!' },
        { letter: 'Z', word: 'Zebra', emoji: '🦓', prompt: 'Ayo cari huruf Z! Z seperti Zebra belang!' }
      ];

      // ----------------------------------------------------------------------
      // 2. SISTEM SUARA (VOICE-FIRST ENGINE & WEB AUDIO SFX)
      // ----------------------------------------------------------------------
      class RacingAudioSystem {
        constructor() {
          this.synth = window.speechSynthesis || null;
          this.audioCtx = null;
          this.currentSpeech = '';
          this.idVoice = null;
          this.unlocked = false;

          this.initSpeech();
        }

        unlock() {
          if (this.unlocked) return;
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.audioCtx = new AudioCtx();
              if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            }
            if (this.synth) this.synth.speak(new SpeechSynthesisUtterance(''));
            this.unlocked = true;
          } catch (e) {}
        }

        initSpeech() {
          if (!this.synth) return;
          const selectIndoVoice = () => {
            try {
              const voices = this.synth.getVoices() || [];
              this.idVoice = voices.find(v => v.lang && (v.lang.includes('id') || v.lang.includes('ID'))) || null;
            } catch (e) {}
          };
          selectIndoVoice();
          if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = selectIndoVoice;
          }
        }

        speakQuestion(text, onEnd) {
          if (!text) { if (onEnd) onEnd(); return; }
          this.currentSpeech = text;

          if (!this.synth) {
            if (onEnd) setTimeout(onEnd, 1200);
            return;
          }

          try { this.synth.cancel(); } catch (e) {}

          try {
            const utter = new SpeechSynthesisUtterance(text);
            if (this.idVoice) utter.voice = this.idVoice;
            utter.lang = 'id-ID';
            utter.rate = 0.88; // Tempo ramah untuk anak 3-5 tahun
            utter.pitch = 1.25; // Ceria & ekspresif
            utter.onend = () => { if (onEnd) onEnd(); };
            utter.onerror = () => { if (onEnd) onEnd(); };
            this.synth.speak(utter);
          } catch (e) {
            if (onEnd) onEnd();
          }
        }

        speakCorrect(onEnd) {
          const praises = [
            "Benar! Hebat sekali!",
            "Pintar sekali! Gerbang terbuka!",
            "Luar biasa! Ayo tancap gas lagi!"
          ];
          const text = praises[Math.floor(Math.random() * praises.length)];
          this.speakQuestion(text, onEnd);
        }

        speakTryAgain() {
          this.speakQuestion("Yuk, coba lagi ya! Dengarkan baik-baik.");
        }

        repeatQuestion() {
          if (this.currentSpeech) {
            this.playTapSound();
            this.speakQuestion(this.currentSpeech);
          }
        }

        _getCtx() {
          if (!this.audioCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.audioCtx = new AudioCtx();
          }
          if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();
          return this.audioCtx;
        }

        // Suara Mesin Mobil Balap Ceria
        playEngineRev() {
          const ctx = this._getCtx();
          if (!ctx) return;
          try {
            const t = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, t);
            osc.frequency.exponentialRampToValueAtTime(320, t + 0.35);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.4);
          } catch (e) {}
        }

        // Suara Geser Jalur Setir (Whoosh)
        playSteerWhoosh() {
          const ctx = this._getCtx();
          if (!ctx) return;
          try {
            const t = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, t);
            osc.frequency.linearRampToValueAtTime(500, t + 0.08);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.09);
          } catch (e) {}
        }

        // Suara Gerbang Terbuka (Ting Ting Fanfare)
        playGateOpenSound() {
          const ctx = this._getCtx();
          if (!ctx) return;
          try {
            const t = ctx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              const st = t + (idx * 0.08);
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, st);
              gain.gain.setValueAtTime(0.25, st);
              gain.gain.exponentialRampToValueAtTime(0.001, st + 0.3);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(st);
              osc.stop(st + 0.3);
            });
          } catch (e) {}
        }

        playTapSound() {
          const ctx = this._getCtx();
          if (!ctx) return;
          try {
            const t = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, t);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.05);
          } catch (e) {}
        }

        playSoftTryAgain() {
          const ctx = this._getCtx();
          if (!ctx) return;
          try {
            const t = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, t);
            osc.frequency.linearRampToValueAtTime(300, t + 0.25);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.3);
          } catch (e) {}
        }
      }

      const audio = new RacingAudioSystem();

      // ----------------------------------------------------------------------
      // 3. CANVAS 2D BALAPAN: 3 JALUR, MOBIL KARTUN, GERBANG CHECKPOINT
      // ----------------------------------------------------------------------
      class RaceTrackRenderer {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext('2d');

          // Jalur Balap: 0 (Kiri), 1 (Tengah), 2 (Kanan)
          this.currentLane = 1;
          this.targetLaneX = 0;
          this.currentCarX = 0;
          this.carY = 0;

          // Animasi Lintasan & Latar Bergerak
          this.roadOffset = 0;
          this.roadSpeed = 5;

          // State Checkpoint Gerbang 2D
          this.gateY = -200; // Posisi vertikal gerbang
          this.isGateVisible = false;
          this.isGateOpen = false;
          this.gateOpenAngle = 0;
          this.gateLetter = 'A';

          this.selectedCarColor = 'red'; // 'red', 'blue', 'yellow', 'green'

          this.resize();
          window.addEventListener('resize', () => this.resize());
        }

        resize() {
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.canvas.width = this.width;
          this.canvas.height = this.height;

          // Hitung Koordinat 3 Jalur (Kiri, Tengah, Kanan)
          const roadWidth = Math.min(this.width * 0.88, 460);
          this.roadLeft = (this.width - roadWidth) / 2;
          this.roadRight = this.roadLeft + roadWidth;
          this.laneWidth = roadWidth / 3;

          this.lanePositions = [
            this.roadLeft + this.laneWidth * 0.5, // Jalur 0: Kiri
            this.roadLeft + this.laneWidth * 1.5, // Jalur 1: Tengah
            this.roadLeft + this.laneWidth * 2.5  // Jalur 2: Kanan
          ];

          this.carY = this.height * 0.74;
          this.targetLaneX = this.lanePositions[this.currentLane];
          if (!this.currentCarX) this.currentCarX = this.targetLaneX;
        }

        setLane(laneIndex) {
          if (laneIndex < 0 || laneIndex > 2) return;
          this.currentLane = laneIndex;
          this.targetLaneX = this.lanePositions[this.currentLane];
          audio.playSteerWhoosh();
        }

        steerLeft() {
          if (this.currentLane > 0) this.setLane(this.currentLane - 1);
        }

        steerRight() {
          if (this.currentLane < 2) this.setLane(this.currentLane + 1);
        }

        setCarColor(color) {
          this.selectedCarColor = color;
        }

        spawnGate(letter) {
          this.gateLetter = letter;
          this.gateY = -120; // Mulai dari atas layar
          this.isGateVisible = true;
          this.isGateOpen = false;
          this.gateOpenAngle = 0;
        }

        openGate() {
          this.isGateOpen = true;
          audio.playGateOpenSound();
        }

        updateDriving(isDriving) {
          // Gerakan Halus Perpindahan Jalur Mobil
          this.currentCarX += (this.targetLaneX - this.currentCarX) * 0.22;

          if (isDriving) {
            this.roadOffset = (this.roadOffset + this.roadSpeed) % 60;

            // Jika ada gerbang aktif, gerbang meluncur turun mendekati mobil
            if (this.isGateVisible && !this.isGateOpen) {
              const stopTargetY = this.carY - 140; // Berhenti tepat di depan moncong mobil
              if (this.gateY < stopTargetY) {
                this.gateY += this.roadSpeed;
              } else {
                this.gateY = stopTargetY;
                // Mobil tiba tepat di Checkpoint!
                return true; // Beri sinyal ke state machine
              }
            } else if (this.isGateOpen) {
              // Gerbang terbuka: Gerbang terus berjalan ke bawah meninggalkan mobil
              this.gateY += this.roadSpeed * 1.4;
              if (this.gateOpenAngle < Math.PI / 2) {
                this.gateOpenAngle += 0.08;
              }
              if (this.gateY > this.height + 100) {
                this.isGateVisible = false;
              }
            }
          }
          return false;
        }

        draw() {
          const ctx = this.ctx;
          const w = this.width;
          const h = this.height;

          ctx.clearRect(0, 0, w, h);

          // 1. Gambar Rumput & Pemandangan Kartun Samping
          this.drawScenery(ctx, w, h);

          // 2. Gambar Lintasan Jalan Raya 3 Jalur
          this.drawRoad(ctx, w, h);

          // 3. Gambar Gerbang Checkpoint (Jika Sedang Aktif)
          if (this.isGateVisible) {
            this.drawGate(ctx, w);
          }

          // 4. Gambar Mobil Balap Kartun
          this.drawCar(ctx, this.currentCarX, this.carY);
        }

        drawScenery(ctx, w, h) {
          // Rumput Hijau Terang Ceria
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(0, 0, w, h);

          // Bukit-bukit Halus di Sisi Kiri & Kanan
          ctx.fillStyle = '#16a34a';
          ctx.beginPath();
          ctx.arc(this.roadLeft - 60, h * 0.3, 110, 0, Math.PI * 2);
          ctx.arc(this.roadLeft - 50, h * 0.7, 90, 0, Math.PI * 2);
          ctx.arc(this.roadRight + 60, h * 0.4, 120, 0, Math.PI * 2);
          ctx.arc(this.roadRight + 50, h * 0.8, 80, 0, Math.PI * 2);
          ctx.fill();

          // Pepohonan Kartun Lucu
          const drawTree = (x, y) => {
            ctx.fillStyle = '#854d0e';
            ctx.fillRect(x - 6, y, 12, 22);
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.arc(x, y - 6, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(x, y - 10, 15, 0, Math.PI * 2);
            ctx.fill();
          };

          drawTree(this.roadLeft - 45, (h * 0.2 + this.roadOffset * 2) % h);
          drawTree(this.roadLeft - 50, (h * 0.6 + this.roadOffset * 2) % h);
          drawTree(this.roadRight + 45, (h * 0.35 + this.roadOffset * 2) % h);
          drawTree(this.roadRight + 55, (h * 0.8 + this.roadOffset * 2) % h);
        }

        drawRoad(ctx, w, h) {
          const rl = this.roadLeft;
          const rr = this.roadRight;
          const rw = rr - rl;

          // Aspal Jalan Abu-Abu Tua Kartun
          ctx.fillStyle = '#334155';
          ctx.fillRect(rl, 0, rw, h);

          // Garis Tepi Bahu Jalan Merah-Putih Balap (Kerb)
          const kerbHeight = 30;
          for (let y = -kerbHeight; y < h + kerbHeight; y += kerbHeight) {
            const isRed = Math.floor((y + this.roadOffset) / kerbHeight) % 2 === 0;
            ctx.fillStyle = isRed ? '#ef4444' : '#ffffff';
            ctx.fillRect(rl - 12, y + (this.roadOffset % kerbHeight), 12, kerbHeight);
            ctx.fillRect(rr, y + (this.roadOffset % kerbHeight), 12, kerbHeight);
          }

          // Garis Putus-Putus Pembatas 3 Jalur
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 5;
          ctx.setLineDash([26, 24]);
          ctx.lineDashOffset = -this.roadOffset * 1.5;

          // Garis Antara Jalur 1 & 2
          ctx.beginPath();
          ctx.moveTo(rl + this.laneWidth, 0);
          ctx.lineTo(rl + this.laneWidth, h);
          ctx.stroke();

          // Garis Antara Jalur 2 & 3
          ctx.beginPath();
          ctx.moveTo(rl + this.laneWidth * 2, 0);
          ctx.lineTo(rl + this.laneWidth * 2, h);
          ctx.stroke();

          ctx.setLineDash([]); // Reset dash
        }

        drawGate(ctx, w) {
          const gy = this.gateY;
          const rl = this.roadLeft - 18;
          const rr = this.roadRight + 18;
          const gateW = rr - rl;

          ctx.save();

          // Tiang Gerbang Kiri & Kanan (Pilar Pelangi Balap)
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(rl, gy - 70, 24, 90);
          ctx.fillRect(rr - 24, gy - 70, 24, 90);

          // Balok Atas Gerbang
          ctx.fillStyle = '#3b82f6';
          ctx.fillRect(rl - 6, gy - 85, gateW + 12, 28);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.strokeRect(rl - 6, gy - 85, gateW + 12, 28);

          // Lencana Huruf Alfabet Besar di Puncak Gerbang
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(w * 0.5, gy - 85, 34, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = '800 36px Fredoka, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.gateLetter, w * 0.5, gy - 85);

          // Daun Pintu Penghalang Jalan
          if (!this.isGateOpen) {
            // Palang Gerbang Tertutup (Garis Belang Kuning-Hitam)
            ctx.fillStyle = '#facc15';
            ctx.fillRect(rl + 24, gy - 20, gateW - 48, 20);
            ctx.fillStyle = '#1e293b';
            for (let x = rl + 30; x < rr - 40; x += 32) {
              ctx.beginPath();
              ctx.moveTo(x, gy - 20);
              ctx.lineTo(x + 16, gy - 20);
              ctx.lineTo(x + 6, gy);
              ctx.lineTo(x - 10, gy);
              ctx.fill();
            }

            // Gembok Emas Bintang
            ctx.fillStyle = '#eab308';
            ctx.beginPath();
            ctx.arc(w * 0.5, gy - 10, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#1e293b';
            ctx.font = '14px sans-serif';
            ctx.fillText('🔒', w * 0.5, gy - 9);

          } else {
            // Palang Gerbang Terangkat Naik (Terbuka!)
            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 14;
            ctx.beginPath();
            ctx.moveTo(rl + 24, gy - 20);
            ctx.lineTo(rl + 24 + Math.cos(-this.gateOpenAngle) * (gateW * 0.45), gy - 20 + Math.sin(-this.gateOpenAngle) * (gateW * 0.45));
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(rr - 24, gy - 20);
            ctx.lineTo(rr - 24 - Math.cos(-this.gateOpenAngle) * (gateW * 0.45), gy - 20 + Math.sin(-this.gateOpenAngle) * (gateW * 0.45));
            ctx.stroke();
          }

          ctx.restore();
        }

        drawCar(ctx, cx, cy) {
          ctx.save();
          ctx.translate(cx, cy);

          // Warna Mobil Kartun
          let bodyColor = '#ef4444';
          let roofColor = '#b91c1c';
          if (this.selectedCarColor === 'blue') { bodyColor = '#3b82f6'; roofColor = '#1d4ed8'; }
          if (this.selectedCarColor === 'yellow') { bodyColor = '#eab308'; roofColor = '#ca8a04'; }
          if (this.selectedCarColor === 'green') { bodyColor = '#10b981'; roofColor = '#047857'; }

          // Bayangan Mobil di Aspal
          ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
          ctx.beginPath();
          ctx.ellipse(0, 32, 34, 12, 0, 0, Math.PI * 2);
          ctx.fill();

          // 4 Roda Ban Balap Hitam Tebal
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-34, -32, 12, 22); // Kiri Depan
          ctx.fillRect(22, -32, 12, 22);  // Kanan Depan
          ctx.fillRect(-34, 14, 12, 22);  // Kiri Belakang
          ctx.fillRect(22, 14, 12, 22);   // Kanan Belakang

          // Pelek Roda Kuning Ceria
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-32, -26, 8, 10);
          ctx.fillRect(24, -26, 8, 10);
          ctx.fillRect(-32, 20, 8, 10);
          ctx.fillRect(24, 20, 8, 10);

          // Bodi Utama Mobil Balap Bulat Lucu
          ctx.fillStyle = bodyColor;
          ctx.beginPath();
          ctx.roundRect(-26, -38, 52, 74, 16);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3.5;
          ctx.stroke();

          // Kaca Depan & Belakang Biru Cerah
          ctx.fillStyle = '#bae6fd';
          ctx.beginPath();
          ctx.roundRect(-18, -26, 36, 18, 8);
          ctx.fill();
          ctx.beginPath();
          ctx.roundRect(-18, 12, 36, 12, 6);
          ctx.fill();

          // Atap Mobil
          ctx.fillStyle = roofColor;
          ctx.beginPath();
          ctx.roundRect(-16, -6, 32, 16, 6);
          ctx.fill();

          // Lampu Depan Menyala Ceria
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(-16, -37, 6, 0, Math.PI * 2);
          ctx.arc(16, -37, 6, 0, Math.PI * 2);
          ctx.fill();

          // Spoiler Belakang Mobil Balap
          ctx.fillStyle = bodyColor;
          ctx.fillRect(-28, 30, 56, 8);

          ctx.restore();
        }
      }

      // ----------------------------------------------------------------------
      // 4. GAME CONTROLLER & STATE MACHINE
      // State Logika Mutlak:
      // DRIVING -> CHECKPOINT -> QUESTION_ACTIVE -> CORRECT_ANSWER -> GATE_OPEN -> DRIVING
      // Jika Salah: QUESTION_ACTIVE -> WRONG_ANSWER -> QUESTION_ACTIVE (Soal Sama!)
      // ----------------------------------------------------------------------
      class AlphabetRacingGame {
        constructor() {
          this.track = null;

          // State Machine Game
          this.gameState = 'MENU'; // 'MENU', 'DRIVING', 'CHECKPOINT', 'QUESTION_ACTIVE', 'CORRECT_ANSWER', 'GATE_OPEN', 'FINISH'
          this.currentCheckpointIndex = 0; // 0..25 (A..Z)
          this.currentQuestionData = null; // Data soal checkpoint aktif
          this.starScore = 0;
          this.isPaused = false;
          this.canAnswer = false;

          this.init();
        }

        init() {
          const canvas = document.getElementById('race-canvas');
          this.track = new RaceTrackRenderer(canvas);

          this.loadProgress();
          this.bindEvents();

          // Jalankan Loop Animasi Game Balap
          this.gameLoop = this.gameLoop.bind(this);
          requestAnimationFrame(this.gameLoop);
        }

        bindEvents() {
          // Tombol Mulai Balapan di Menu
          document.getElementById('btn-start-race')?.addEventListener('click', () => {
            audio.unlock();
            audio.playEngineRev();
            this.startGame();
          });

          // Pilihan Warna Mobil
          document.querySelectorAll('.car-option-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              audio.playTapSound();
              document.querySelectorAll('.car-option-btn').forEach(b => b.classList.remove('selected'));
              e.currentTarget.classList.add('selected');
              const color = e.currentTarget.getAttribute('data-car');
              this.track.setCarColor(color);
            });
          });

          // Tombol Setir HP Kiri & Kanan
          document.getElementById('btn-steer-left')?.addEventListener('click', () => {
            if (this.gameState === 'DRIVING') this.track.steerLeft();
          });
          document.getElementById('btn-steer-right')?.addEventListener('click', () => {
            if (this.gameState === 'DRIVING') this.track.steerRight();
          });

          // Kontrol Keyboard untuk Pengujian Laptop/Komputer (ArrowLeft, ArrowRight)
          window.addEventListener('keydown', (e) => {
            if (this.gameState === 'DRIVING') {
              if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.track.steerLeft();
              if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.track.steerRight();
            }
          });

          // Tombol Home Menu
          document.getElementById('btn-home')?.addEventListener('click', () => {
            audio.playTapSound();
            this.showMainMenu();
          });

          // Tombol Ulangi Suara Pertanyaan
          document.getElementById('btn-repeat-voice')?.addEventListener('click', () => {
            audio.repeatQuestion();
          });

          document.getElementById('btn-voice-prompt-box')?.addEventListener('click', () => {
            audio.repeatQuestion();
          });

          // Tombol Main Lagi di Layar Finis
          document.getElementById('btn-restart-race')?.addEventListener('click', () => {
            audio.unlock();
            audio.playEngineRev();
            this.restartGame();
          });
        }

        loadProgress() {
          try {
            const saved = localStorage.getItem('alphabet_racing_progress');
            if (saved) {
              const data = JSON.parse(saved);
              this.starScore = data.starScore || 0;
              document.getElementById('star-score-label').innerText = this.starScore;
            }
          } catch (e) {}
        }

        saveProgress() {
          try {
            const data = {
              starScore: this.starScore,
              checkpointIndex: this.currentCheckpointIndex,
              timestamp: Date.now()
            };
            localStorage.setItem('alphabet_racing_progress', JSON.stringify(data));
          } catch (e) {}
        }

        showMainMenu() {
          this.gameState = 'MENU';
          document.getElementById('main-menu-screen')?.classList.remove('hidden');
          document.getElementById('question-card-overlay')?.classList.add('hidden');
          document.getElementById('victory-screen')?.classList.add('hidden');
        }

        startGame() {
          document.getElementById('main-menu-screen')?.classList.add('hidden');
          document.getElementById('victory-screen')?.classList.add('hidden');

          this.currentCheckpointIndex = 0;
          this.resumeRace();
        }

        restartGame() {
          this.currentCheckpointIndex = 0;
          this.starScore = 0;
          document.getElementById('star-score-label').innerText = this.starScore;
          document.getElementById('victory-screen')?.classList.add('hidden');
          this.resumeRace();
        }

        // ================= RESUME RACE (DRIVING MODE) ================= //
        resumeRace() {
          this.gameState = 'DRIVING';
          document.getElementById('question-card-overlay')?.classList.add('hidden');

          const cpData = ALPHABET_CHECKPOINTS[this.currentCheckpointIndex];
          document.getElementById('checkpoint-label').innerText = `Gerbang ${cpData.letter} (${this.currentCheckpointIndex + 1}/26)`;

          // Munculkan Gerbang Alfabet Checkpoint di Depan Lintasan
          this.track.spawnGate(cpData.letter);
        }

        // ================= KETIKA MOBIL TIBA DI CHECKPOINT ================= //
        handleCarArrivedAtCheckpoint() {
          // Cegah eksekusi ganda jika sudah dalam kuis
          if (this.gameState !== 'DRIVING') return;

          this.gameState = 'CHECKPOINT';
          this.showQuestionForCurrentCheckpoint();
        }

        // ================= ATURAN PALING PENTING: SATU SOAL PER CHECKPOINT ================= //
        showQuestionForCurrentCheckpoint() {
          this.gameState = 'QUESTION_ACTIVE';
          this.canAnswer = true;

          const cpData = ALPHABET_CHECKPOINTS[this.currentCheckpointIndex];
          this.currentQuestionData = cpData;

          // Buat 3 Pilihan Huruf (1 Benar, 2 Pengecoh)
          let choices = [cpData.letter];
          let otherLetters = ALPHABET_CHECKPOINTS.map(x => x.letter).filter(l => l !== cpData.letter);
          otherLetters.sort(() => Math.random() - 0.5);
          choices.push(otherLetters[0], otherLetters[1]);
          choices.sort(() => Math.random() - 0.5); // Acak posisi tombol

          // Update Teks Tampilan Pertanyaan
          const promptText = cpData.prompt;
          document.getElementById('question-prompt-text').innerText = promptText;

          // Render 3 Tombol Huruf Besar
          const container = document.getElementById('choices-container');
          container.innerHTML = '';

          choices.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'choice-card-btn';
            btn.setAttribute('data-letter', letter);

            // Cari kata pendukung untuk huruf tersebut
            const matchedInfo = ALPHABET_CHECKPOINTS.find(x => x.letter === letter);

            btn.innerHTML = `
              <span class="choice-char">${letter}</span>
              <span class="choice-word-hint">${matchedInfo ? matchedInfo.word : ''}</span>
            `;

            btn.addEventListener('click', () => {
              if (!this.canAnswer) return;
              this.checkAnswer(letter, cpData.letter, btn);
            });

            container.appendChild(btn);
          });

          // Tampilkan Overlay Kuis
          document.getElementById('question-card-overlay')?.classList.remove('hidden');

          // Putar Suara Pertanyaan Secara Otomatis
          audio.speakQuestion(promptText);
        }

        // ================= VALIDASI JAWABAN KETAT ================= //
        checkAnswer(selectedLetter, correctLetter, btnElement) {
          audio.playTapSound();

          if (selectedLetter === correctLetter) {
            // JAWABAN BENAR!
            this.canAnswer = false; // Kunci input agar tidak klik ganda
            this.gameState = 'CORRECT_ANSWER';

            this.starScore += 1;
            this.saveProgress();
            document.getElementById('star-score-label').innerText = this.starScore;

            btnElement.classList.add('card-correct-pop');

            // Buka Gerbang Balap
            this.gameState = 'GATE_OPEN';
            this.track.openGate();

            // Ucapkan Pujian Ceria & Lanjutkan Mobil Otomatis
            audio.speakCorrect(() => {
              setTimeout(() => {
                this.handleCheckpointResolved();
              }, 400);
            });

          } else {
            // JAWABAN SALAH:
            // ATURAN MUTLAK:
            // - Jangan ganti soal!
            // - Jangan membuka gerbang!
            // - Mobil tetap berhenti!
            audio.playSoftTryAgain();
            btnElement.classList.add('card-shake-soft');
            setTimeout(() => btnElement.classList.remove('card-shake-soft'), 500);

            audio.speakTryAgain();
          }
        }

        // ================= CHECKPOINT SELESAI, LANJUTKAN BALAPAN ================= //
        handleCheckpointResolved() {
          // Tandai checkpoint saat ini selesai
          if (this.currentCheckpointIndex + 1 < ALPHABET_CHECKPOINTS.length) {
            this.currentCheckpointIndex++;
            this.resumeRace(); // Mobil kembali melaju otomatis ke huruf berikutnya!
          } else {
            // Berhasil Menyelesaikan Seluruh 26 Huruf A-Z!
            this.finishGame();
          }
        }

        finishGame() {
          this.gameState = 'FINISH';
          document.getElementById('question-card-overlay')?.classList.add('hidden');
          const victoryScreen = document.getElementById('victory-screen');
          victoryScreen.classList.remove('hidden');

          audio.playGateOpenSound();
          audio.speakQuestion("Horeee! Selamat! Kamu berhasil menyelesaikan semua gerbang alfabet A sampai Z! Kamu adalah juara balap sejati!");
        }

        // ================= LOOP GAME ANIMASI ================= //
        gameLoop() {
          const isDriving = (this.gameState === 'DRIVING' || this.gameState === 'GATE_OPEN');
          const hitCheckpoint = this.track.updateDriving(isDriving);

          if (hitCheckpoint && this.gameState === 'DRIVING') {
            this.handleCarArrivedAtCheckpoint();
          }

          this.track.draw();
          requestAnimationFrame(this.gameLoop);
        }
      }

      // Jalankan Game saat DOM Siap
      window.addEventListener('DOMContentLoaded', () => {
        window.racingGame = new AlphabetRacingGame();
      });

    })();
  </script>
</body>
</html>
