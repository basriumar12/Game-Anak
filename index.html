<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Adventure Quest: The Lost Crystals — Game Edukasi Platformer</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ADVENTURE QUEST: THE LOST CRYSTALS — STYLING
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      background: #090d16;
      touch-action: none;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Canvas Game Engine 2D Platformer */
    #adventure-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 5;
    }

    /* ================= 1. TOP HUD (STATUS, KRISTAL, KOIN & AUDIO) ================= */
    .top-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 12px) 16px 8px;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }

    .hud-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
    }
    .hud-circle-btn:active { transform: scale(0.9); }
    .btn-home { border-color: #f59e0b; background: #fef08a; }
    .btn-speaker { border-color: #10b981; background: #bbf7d0; }
    .btn-mode-switch { border-color: #ec4899; background: #fce7f3; font-size: 16px; font-weight: 800; width: auto; padding: 0 14px; border-radius: 24px; gap: 6px; }

    /* Kristal & Koin Badge */
    .hud-stat-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #38bdf8;
      padding: 6px 14px;
      border-radius: 26px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }

    .crystal-dots-wrap {
      display: flex;
      gap: 4px;
    }
    .c-dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      transform: rotate(45deg);
      background: #475569;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
    }
    .c-dot.unlocked {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    /* ================= 2. KONTROL TOUCHSCREEN HP ================= */
    .bottom-controls-layer {
      position: absolute;
      bottom: 16px;
      left: 0;
      width: 100%;
      z-index: 45;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px env(safe-area-inset-bottom, 12px);
      pointer-events: none;
    }

    .dpad-walk-group {
      pointer-events: auto;
      display: flex;
      gap: 14px;
    }

    .touch-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 4px solid #38bdf8;
      color: #0369a1;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      transition: transform 0.08s ease, background 0.1s;
    }
    .touch-btn:active {
      transform: scale(0.9);
      background: #38bdf8;
      color: #ffffff;
    }

    .actions-group {
      pointer-events: auto;
      display: flex;
      gap: 14px;
    }

    .btn-action-jump {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-color: #ffffff;
      color: #ffffff;
      font-size: 28px;
    }

    .btn-action-interact {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: #ffffff;
      color: #ffffff;
      font-size: 26px;
      display: flex;
      flex-direction: column;
      font-size: 11px;
      font-weight: 800;
    }
    .btn-action-interact span { font-size: 22px; }

    /* ================= 3. OVERLAY TANTANGAN EDUKASI MODULAR ================= */
    #challenge-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 80;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .challenge-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 6px solid #f59e0b;
      border-radius: 34px;
      padding: 24px 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: popCard 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popCard {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .challenge-badge-category {
      background: #fef08a;
      color: #b45309;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      border: 2px solid #f59e0b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .challenge-prompt-box {
      width: 100%;
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .challenge-speaker-icon { font-size: 28px; }
    .challenge-text { font-size: 17px; font-weight: 800; color: #1e293b; line-height: 1.3; }

    .choices-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .choice-option-btn {
      width: 100%;
      padding: 14px 18px;
      background: #ffffff;
      border: 3.5px solid #38bdf8;
      border-radius: 20px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      color: #0369a1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 14px rgba(2, 132, 199, 0.15);
      transition: transform 0.1s ease, border-color 0.15s ease;
    }
    .choice-option-btn:active { transform: scale(0.97); }

    .card-shake {
      animation: shakeAnim 0.4s ease-in-out;
      border-color: #ef4444 !important;
      background: #fef2f2 !important;
    }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .card-correct {
      animation: popWin 0.5s ease-in-out;
      border-color: #22c55e !important;
      background: #dcfce7 !important;
    }
    @keyframes popWin {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* ================= 4. MENU UTAMA, PILIH DUNIA & KATEGORI ================= */
    #menu-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: linear-gradient(180deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
      text-align: center;
    }

    .game-logo-art {
      font-size: 72px;
      margin-bottom: 6px;
      animation: floatLogo 2s infinite ease-in-out;
    }
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .game-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .game-subtitle {
      font-size: 15px;
      color: #93c5fd;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* Selector Kategori Edukasi Modular */
    .category-dock-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #facc15;
      margin-bottom: 8px;
    }

    .category-chips-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 460px;
      margin-bottom: 24px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s;
    }
    .chip-btn.active {
      background: #38bdf8;
      border-color: #ffffff;
      color: #0f172a;
      box-shadow: 0 0 12px #38bdf8;
    }

    .btn-play-adventure {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      border: 5px solid #ffffff;
      border-radius: 40px;
      padding: 16px 48px;
      font-size: 22px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(34, 197, 94, 0.5);
      transition: transform 0.1s ease;
    }
    .btn-play-adventure:active { transform: scale(0.95); }

    /* ================= 5. POPUP KEMENANGAN ================= */
    #victory-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 110;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #ffffff;
    }

    .trophy-badge { font-size: 88px; animation: floatLogo 1.6s infinite ease-in-out; }
    .btn-next-world {
      margin-top: 20px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border: 4px solid #ffffff;
      border-radius: 30px;
      padding: 14px 40px;
      font-size: 20px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app-container">
    
    <!-- 1. Top HUD Header -->
    <header class="top-hud">
      <div class="hud-group">
        <button id="btn-back-home" class="hud-circle-btn btn-home" aria-label="Menu Utama" title="Menu Utama">🏠</button>
        <button id="btn-repeat-voice" class="hud-circle-btn btn-speaker" aria-label="Ulangi Suara" title="Ulangi Suara">🔊</button>
        <!-- Tombol Ganti Mode Balap / Petualangan Cepat -->
        <button id="btn-switch-game-mode" class="hud-circle-btn btn-mode-switch" title="Ganti Mode Permainan">
          <span>🎮</span>
          <span id="game-mode-tag">Petualangan</span>
        </button>
      </div>

      <div class="hud-group">
        <div class="hud-stat-pill">
          <span>🪙</span>
          <span id="coin-counter">0</span>
        </div>
        <div class="hud-stat-pill">
          <span>💎</span>
          <div class="crystal-dots-wrap" id="crystal-dots">
            <div class="c-dot"></div>
            <div class="c-dot"></div>
            <div class="c-dot"></div>
            <div class="c-dot"></div>
            <div class="c-dot"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. Canvas 2D Game Petualangan Platformer -->
    <canvas id="adventure-canvas"></canvas>

    <!-- 3. Tombol Kontrol Layar Sentuh HP -->
    <div class="bottom-controls-layer">
      <!-- Tombol Gerak Kiri & Kanan -->
      <div class="dpad-walk-group">
        <button id="btn-move-left" class="touch-btn" aria-label="Jalan Kiri">◀</button>
        <button id="btn-move-right" class="touch-btn" aria-label="Jalan Kanan">▶</button>
      </div>

      <!-- Tombol Aksi Lompat & Interaksi -->
      <div class="actions-group">
        <button id="btn-interact" class="touch-btn btn-action-interact" aria-label="Interaksi">
          <span>✋</span>
          BUKA
        </button>
        <button id="btn-jump" class="touch-btn btn-action-jump" aria-label="Lompat">▲</button>
      </div>
    </div>

    <!-- 4. Modal Tantangan Edukasi Modular (Muncul di Gerbang / Peti / Kristal) -->
    <div id="challenge-modal" class="hidden">
      <div class="challenge-card">
        <span class="challenge-badge-category" id="challenge-category-label">Matematika Dasar</span>

        <div id="challenge-speech-bar" class="challenge-prompt-box">
          <span class="challenge-speaker-icon">🔊</span>
          <span id="challenge-prompt-text" class="challenge-text">Berapa hasil dari 2 + 3?</span>
        </div>

        <div id="challenge-choices-container" class="choices-grid">
          <!-- Tombol Pilihan Jawaban Dinamis -->
        </div>
      </div>
    </div>

    <!-- 5. Layar Menu Utama (Pilih Dunia & Kategori Edukasi) -->
    <div id="menu-screen">
      <div class="game-logo-art">💎✨</div>
      <h1 class="game-title">ADVENTURE QUEST</h1>
      <p class="game-subtitle">The Lost Crystals & Edukasi Cerdas</p>

      <p class="category-dock-title">Pilih Pelajaran Edukasi:</p>
      <div class="category-chips-row" id="category-chips-wrap">
        <button class="chip-btn active" data-cat="math">🔢 Matematika</button>
        <button class="chip-btn" data-cat="english">🔤 English</button>
        <button class="chip-btn" data-cat="indo">🇮🇩 B. Indonesia</button>
        <button class="chip-btn" data-cat="science">🌱 Sains & Alam</button>
        <button class="chip-btn" data-cat="coding">💻 Koding & Logika</button>
        <button class="chip-btn" data-cat="hijaiyah">📖 Hijaiyah</button>
      </div>

      <button id="btn-start-quest" class="btn-play-adventure">MULAI PETUALANGAN! 🚀</button>
    </div>

    <!-- 6. Modal Kemenangan Wilayah (Dapat Kristal) -->
    <div id="victory-modal" class="hidden">
      <div class="trophy-badge">💎👑</div>
      <h2 style="font-size: 28px; font-weight: 800; color: #38bdf8; margin-top: 10px;">KRISTAL DITEMUKAN!</h2>
      <p id="victory-desc" style="font-size: 16px; margin-top: 6px; opacity: 0.95;">
        Kamu berhasil menyelamatkan Kristal Hutan Ajaib!
      </p>
      <button id="btn-next-world" class="btn-next-world">Lanjut ke Wilayah Berikutnya! 🗺️</button>
    </div>

  </div>

  <!-- ==========================================================================
       ENGINE LOGIKA GAME PLATFORMER 2D, MODULAR EDUKASI & AUDIO SYNTHESIZER
       ========================================================================== -->
  <script>
    (function() {
      'use strict';

      // ----------------------------------------------------------------------
      // 1. DATA EDUKASI MODULAR (BISA DIGANTI BEBAS)
      // ----------------------------------------------------------------------
      const EDUCATION_DATABASE = {
        math: [
          { q: 'Berapakah 2 + 3?', options: ['5', '6', '4'], answer: '5', hint: 'Dua ditambah tiga sama dengan lima!' },
          { q: 'Mana bilangan yang lebih besar?', options: ['9', '4', '2'], answer: '9', hint: 'Sembilan adalah angka paling besar!' },
          { q: 'Berapakah 10 dikurangi 4?', options: ['6', '5', '7'], answer: '6', hint: 'Sepuluh dikurangi empat adalah enam!' },
          { q: 'Berapakah 3 + 4?', options: ['7', '8', '6'], answer: '7', hint: 'Tiga ditambah empat adalah tujuh!' },
          { q: 'Jika punya 4 apel lalu dapat 2 lagi, berapa totalnya?', options: ['6', '5', '7'], answer: '6', hint: 'Empat ditambah dua adalah enam!' }
        ],
        english: [
          { q: 'What is the English word for "Apel"?', options: ['Apple', 'Banana', 'Orange'], answer: 'Apple', hint: 'Apel dalam bahasa Inggris adalah Apple!' },
          { q: 'Which word means "Kucing"?', options: ['Cat', 'Dog', 'Bird'], answer: 'Cat', hint: 'Kucing dalam bahasa Inggris adalah Cat!' },
          { q: 'Choose the correct word for "Buku":', options: ['Book', 'Pencil', 'Bag'], answer: 'Book', hint: 'Buku dalam bahasa Inggris adalah Book!' },
          { q: 'What color is "Merah"?', options: ['Red', 'Blue', 'Green'], answer: 'Red', hint: 'Warna merah adalah Red!' },
          { q: 'What is "Matahari" in English?', options: ['Sun', 'Moon', 'Star'], answer: 'Sun', hint: 'Matahari adalah Sun!' }
        ],
        indo: [
          { q: 'Huruf pertama dari kata "Gajah" adalah...', options: ['G', 'J', 'H'], answer: 'G', hint: 'Gajah diawali dengan huruf G!' },
          { q: 'Lawan kata dari kata "Besar" adalah...', options: ['Kecil', 'Tinggi', 'Panjang'], answer: 'Kecil', hint: 'Lawan kata besar adalah kecil!' },
          { q: 'Hewan yang bisa terbang di udara adalah...', options: ['Burung', 'Ikan', 'Kucing'], answer: 'Burung', hint: 'Burung memiliki sayap untuk terbang!' },
          { q: 'Huruf vokal pada kata "BOLA" adalah...', options: ['O dan A', 'B dan L', 'B dan O'], answer: 'O dan A', hint: 'Huruf vokal adalah A, I, U, E, O!' }
        ],
        science: [
          { q: 'Bagian tumbuhan yang menyerap air dari dalam tanah adalah...', options: ['Akar', 'Daun', 'Bunga'], answer: 'Akar', hint: 'Akar bertugas menyerap air dari tanah!' },
          { q: 'Hewan yang bernapas menggunakan insang di air adalah...', options: ['Ikan', 'Kelinci', 'Kambing'], answer: 'Ikan', hint: 'Ikan hidup di air dan bernapas dengan insang!' },
          { q: 'Benda langit yang menerangi bumi di siang hari adalah...', options: ['Matahari', 'Bulan', 'Bintang'], answer: 'Matahari', hint: 'Matahari memberikan cahaya di siang hari!' }
        ],
        coding: [
          { q: 'Apa fungsi dari perintah IF dalam koding?', options: ['Pilihan kondisi', 'Mengulang lagu', 'Mematikan layar'], answer: 'Pilihan kondisi', hint: 'IF digunakan untuk memeriksa kondisi!' },
          { q: 'Untuk mengulang gerakan berjalan 5 kali, kita gunakan...', options: ['Loop / Perulangan', 'Stop', 'Hapus'], answer: 'Loop / Perulangan', hint: 'Loop digunakan untuk mengulang aksi!' },
          { q: 'Jika karakter menabrak dinding, apa yang harus dilakukan?', options: ['Berhenti / Berbalik', 'Menembus', 'Hilang'], answer: 'Berhenti / Berbalik', hint: 'Karakter harus berhenti saat bertemu rintangan!' }
        ],
        hijaiyah: [
          { q: 'Mana huruf Alif (ا)?', options: ['ا', 'ب', 'ت'], answer: 'ا', hint: 'Huruf Alif tegak lurus seperti tiang!' },
          { q: 'Mana huruf Ba (ب) dengan satu titik di bawah?', options: ['ب', 'ت', 'ث'], answer: 'ب', hint: 'Huruf Ba memiliki satu titik di bawah!' },
          { q: 'Mana huruf Ta (ت) dengan dua titik di atas?', options: ['ت', 'ب', 'ث'], answer: 'ت', hint: 'Huruf Ta memiliki dua titik di atas!' }
        ]
      };

      // ----------------------------------------------------------------------
      // 2. 5 WILAYAH PETUALANGAN (WORLDS & CRYSTALS)
      // ----------------------------------------------------------------------
      const WORLDS = [
        { id: 1, name: 'Enchanted Forest', theme: 'forest', skyColor: '#1e3a5f', groundColor: '#15803d', crystalName: 'Kristal Hutan Hijau' },
        { id: 2, name: 'Desert of Secrets', theme: 'desert', skyColor: '#78350f', groundColor: '#d97706', crystalName: 'Kristal Pasir Emas' },
        { id: 3, name: 'Frozen Mountain', theme: 'snow', skyColor: '#0f172a', groundColor: '#38bdf8', crystalName: 'Kristal Es Abadi' },
        { id: 4, name: 'Sky Islands', theme: 'sky', skyColor: '#0284c7', groundColor: '#a855f7', crystalName: 'Kristal Langit Biru' },
        { id: 5, name: 'Dark Castle', theme: 'castle', skyColor: '#18181b', groundColor: '#475569', crystalName: 'Kristal Mahkota Kerajaan' }
      ];

      // ----------------------------------------------------------------------
      // 3. AUDIO ENGINE & SYNTHESIZER
      // ----------------------------------------------------------------------
      class SoundEngine {
        constructor() {
          this.synth = window.speechSynthesis || null;
          this.audioCtx = null;
          this.lastSpeech = '';
          this.idVoice = null;
          this.initVoice();
        }

        initVoice() {
          if (!this.synth) return;
          const setV = () => {
            const voices = this.synth.getVoices() || [];
            this.idVoice = voices.find(v => v.lang && (v.lang.includes('id') || v.lang.includes('ID'))) || null;
          };
          setV();
          if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = setV;
          }
        }

        speak(text, onEnd) {
          if (!text) { if (onEnd) onEnd(); return; }
          this.lastSpeech = text;
          if (!this.synth) { if (onEnd) setTimeout(onEnd, 1000); return; }

          try { this.synth.cancel(); } catch(e) {}
          try {
            const u = new SpeechSynthesisUtterance(text);
            if (this.idVoice) u.voice = this.idVoice;
            u.lang = 'id-ID';
            u.rate = 0.9;
            u.pitch = 1.2;
            u.onend = () => { if (onEnd) onEnd(); };
            u.onerror = () => { if (onEnd) onEnd(); };
            this.synth.speak(u);
          } catch(e) {
            if (onEnd) onEnd();
          }
        }

        repeat() {
          if (this.lastSpeech) this.speak(this.lastSpeech);
        }

        _getCtx() {
          if (!this.audioCtx) {
            const ACtx = window.AudioContext || window.webkitAudioContext;
            if (ACtx) this.audioCtx = new ACtx();
          }
          if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();
          return this.audioCtx;
        }

        playJump() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(260, t);
            osc.frequency.exponentialRampToValueAtTime(540, t + 0.12);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.14);
          } catch(e) {}
        }

        playCoin() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(987.77, t); // B5
            osc.frequency.setValueAtTime(1318.51, t + 0.08); // E6
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.25);
          } catch(e) {}
        }

        playCrystalUnlock() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
              const osc = c.createOscillator();
              const gain = c.createGain();
              const st = t + (i * 0.09);
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, st);
              gain.gain.setValueAtTime(0.28, st);
              gain.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
              osc.connect(gain);
              gain.connect(c.destination);
              osc.start(st);
              osc.stop(st + 0.35);
            });
          } catch(e) {}
        }

        playWrong() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(280, t);
            osc.frequency.linearRampToValueAtTime(180, t + 0.25);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.3);
          } catch(e) {}
        }
      }

      const audio = new SoundEngine();

      // ----------------------------------------------------------------------
      // 4. PLATFORMER 2D ENGINE (PHYSICS, CAMERA, PARALLAX, TILES)
      // ----------------------------------------------------------------------
      class AdventureWorldEngine {
        constructor(canvas, onTriggerChallenge, onCollectCrystal) {
          this.canvas = canvas;
          this.ctx = canvas.getContext('2d');
          this.onTriggerChallenge = onTriggerChallenge;
          this.onCollectCrystal = onCollectCrystal;

          // Kamera Scrolling Mengikuti Karakter
          this.cameraX = 0;
          this.worldWidth = 3200; // Panjang level horizontal

          // Karakter Petualang
          this.hero = {
            x: 80,
            y: 350,
            width: 38,
            height: 52,
            vx: 0,
            vy: 0,
            speed: 5.5,
            jumpStrength: 13.5,
            isGrounded: false,
            facingRight: true,
            walkFrame: 0
          };

          // Kontrol Input
          this.keys = { left: false, right: false, jump: false, interact: false };

          // Elemen Dunia
          this.platforms = [];
          this.coins = [];
          this.gates = [];
          this.crystalTarget = null;
          this.currentWorldIndex = 0;

          this.resize();
          window.addEventListener('resize', () => this.resize());
        }

        resize() {
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.canvas.width = this.width;
          this.canvas.height = this.height;
        }

        loadWorld(worldIdx) {
          this.currentWorldIndex = worldIdx;
          const wData = WORLDS[worldIdx] || WORLDS[0];

          // Reset Posisi Karakter
          this.hero.x = 80;
          this.hero.y = this.height * 0.6;
          this.hero.vx = 0;
          this.hero.vy = 0;
          this.cameraX = 0;

          // Buat Platform, Jurang, dan Tantangan
          this.platforms = [
            { x: 0, y: this.height * 0.8, w: 700, h: 200 },       // Ground Awal
            { x: 780, y: this.height * 0.72, w: 220, h: 40 },     // Platform Melayang 1
            { x: 1080, y: this.height * 0.64, w: 260, h: 40 },    // Platform Melayang 2
            { x: 1420, y: this.height * 0.8, w: 800, h: 200 },    // Ground Tengah
            { x: 2320, y: this.height * 0.7, w: 240, h: 40 },     // Platform Melayang 3
            { x: 2640, y: this.height * 0.8, w: 600, h: 200 }     // Ground Akhir (Kuil Kristal)
          ];

          // Sebar Koin Emas
          this.coins = [
            { x: 250, y: this.height * 0.72, collected: false },
            { x: 380, y: this.height * 0.72, collected: false },
            { x: 860, y: this.height * 0.62, collected: false },
            { x: 1180, y: this.height * 0.54, collected: false },
            { x: 1600, y: this.height * 0.72, collected: false },
            { x: 1800, y: this.height * 0.72, collected: false },
            { x: 2420, y: this.height * 0.62, collected: false }
          ];

          // Gerbang Ajaib Tantangan Edukasi di Tengah Lintasan
          this.gates = [
            { x: 1750, y: this.height * 0.8 - 140, w: 40, h: 140, isOpen: false, id: 1, name: 'Gerbang Kuno' }
          ];

          // Kristal Kekuatan Utama di Ujung Level
          this.crystalTarget = {
            x: 2980,
            y: this.height * 0.8 - 90,
            w: 48,
            h: 48,
            collected: false,
            name: wData.crystalName
          };
        }

        updatePhysics(isPaused) {
          if (isPaused) return;

          const h = this.hero;

          // 1. Gerakan Horizontal
          if (this.keys.left) {
            h.vx = -h.speed;
            h.facingRight = false;
            h.walkFrame += 0.2;
          } else if (this.keys.right) {
            h.vx = h.speed;
            h.facingRight = true;
            h.walkFrame += 0.2;
          } else {
            h.vx *= 0.7; // Deselerasi halus
          }

          h.x += h.vx;

          // 2. Gravitasi & Lompat
          h.vy += 0.65; // Gaya gravitasi
          h.y += h.vy;

          if (this.keys.jump && h.isGrounded) {
            h.vy = -h.jumpStrength;
            h.isGrounded = false;
            audio.playJump();
          }

          // 3. Deteksi Tabrakan dengan Platform
          h.isGrounded = false;
          for (let p of this.platforms) {
            if (
              h.x + h.width > p.x &&
              h.x < p.x + p.w &&
              h.y + h.height >= p.y &&
              h.y + h.height <= p.y + 24 &&
              h.vy >= 0
            ) {
              h.y = p.y - h.height;
              h.vy = 0;
              h.isGrounded = true;
            }
          }

          // Batasi jika jatuh ke jurang -> Kembalikan ke platform terdekat
          if (h.y > this.height + 60) {
            h.x = Math.max(80, h.x - 300);
            h.y = this.height * 0.5;
            h.vy = 0;
          }

          // 4. Deteksi Tabrakan dengan Gerbang Terkunci
          for (let gate of this.gates) {
            if (!gate.isOpen) {
              if (h.x + h.width >= gate.x && h.x <= gate.x + gate.w && h.y + h.height > gate.y) {
                // Karakter tertahan di depan gerbang!
                h.x = gate.x - h.width;
                h.vx = 0;
                // Picu tantangan jika belum terbuka
                if (this.onTriggerChallenge) this.onTriggerChallenge(gate);
              }
            }
          }

          // 5. Pengumpulan Koin
          for (let c of this.coins) {
            if (!c.collected && Math.hypot((h.x + 19) - c.x, (h.y + 26) - c.y) < 32) {
              c.collected = true;
              audio.playCoin();
              if (window.questApp) window.questApp.addCoin();
            }
          }

          // 6. Pengumpulan Kristal di Akhir Level
          if (this.crystalTarget && !this.crystalTarget.collected) {
            const ct = this.crystalTarget;
            if (Math.hypot((h.x + 19) - (ct.x + 24), (h.y + 26) - (ct.y + 24)) < 44) {
              ct.collected = true;
              audio.playCrystalUnlock();
              if (this.onCollectCrystal) this.onCollectCrystal(ct);
            }
          }

          // 7. Kamera Mengikuti Karakter Secara Halus
          const targetCamX = h.x - this.width * 0.35;
          this.cameraX += (targetCamX - this.cameraX) * 0.12;
          this.cameraX = Math.max(0, Math.min(this.worldWidth - this.width, this.cameraX));
        }

        draw() {
          const ctx = this.ctx;
          const w = this.width;
          const h = this.height;
          const wData = WORLDS[this.currentWorldIndex] || WORLDS[0];

          ctx.clearRect(0, 0, w, h);

          // 1. Langit & Latar Belakang Parallax
          ctx.fillStyle = wData.skyColor;
          ctx.fillRect(0, 0, w, h);

          // Lapisan Gunung Parallax Jauh
          ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
          for (let i = 0; i < 8; i++) {
            const gx = (i * 500) - (this.cameraX * 0.2);
            ctx.beginPath();
            ctx.arc(gx, h * 0.75, 240, Math.PI, 0);
            ctx.fill();
          }

          ctx.save();
          ctx.translate(-this.cameraX, 0);

          // 2. Gambar Platform Tanah & Melayang
          for (let p of this.platforms) {
            // Atas Rumput / Permukaan
            ctx.fillStyle = wData.groundColor;
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, 18, [8, 8, 0, 0]);
            ctx.fill();

            // Badan Tanah Bawah
            ctx.fillStyle = '#334155';
            ctx.fillRect(p.x, p.y + 18, p.w, p.h - 18);
          }

          // 3. Gambar Koin Emas Berputar
          for (let c of this.coins) {
            if (!c.collected) {
              ctx.fillStyle = '#facc15';
              ctx.beginPath();
              ctx.arc(c.x, c.y, 11, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#ca8a04';
              ctx.lineWidth = 3;
              ctx.stroke();
            }
          }

          // 4. Gambar Gerbang Ajaib
          for (let gate of this.gates) {
            ctx.fillStyle = gate.isOpen ? '#22c55e' : '#f59e0b';
            ctx.fillRect(gate.x, gate.y, gate.w, gate.h);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(gate.x, gate.y, gate.w, gate.h);

            // Gembok Simbol
            ctx.fillStyle = '#ffffff';
            ctx.font = '22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(gate.isOpen ? '🔓' : '🔒', gate.x + 20, gate.y + 60);
          }

          // 5. Gambar Kristal Utama di Akhir Level
          if (this.crystalTarget && !this.crystalTarget.collected) {
            const ct = this.crystalTarget;
            ctx.save();
            ctx.translate(ct.x + 24, ct.y + 24);
            ctx.rotate(Date.now() * 0.002);

            // Kristal Berlian Bercahaya
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(0, -24);
            ctx.lineTo(18, 0);
            ctx.lineTo(0, 24);
            ctx.lineTo(-18, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
          }

          // 6. Gambar Karakter Petualang
          this.drawHero(ctx);

          ctx.restore();
        }

        drawHero(ctx) {
          const h = this.hero;
          ctx.save();
          ctx.translate(h.x + h.width / 2, h.y + h.height / 2);
          if (!h.facingRight) ctx.scale(-1, 1);

          // Bayangan Kaki
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath();
          ctx.ellipse(0, 24, 16, 6, 0, 0, Math.PI * 2);
          ctx.fill();

          // Badan & Baju Petualang
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.roundRect(-14, -12, 28, 28, 6);
          ctx.fill();

          // Syal / Jubah Merah Petualang
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-12, -14, 24, 6);

          // Kepala & Topi
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(0, -22, 12, 0, Math.PI * 2);
          ctx.fill();

          // Mata Petualang Ceria
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(4, -22, 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      // ----------------------------------------------------------------------
      // 5. CONTROLLER UTAMA ADVENTURE QUEST (LOGIKA EDUKASI & PROGRESS)
      // ----------------------------------------------------------------------
      class AdventureQuestApp {
        constructor() {
          this.worldEngine = null;
          this.currentCategory = 'math';
          this.currentWorldIdx = 0;
          this.coins = 0;
          this.crystalsUnlocked = 0;
          this.activeGate = null;
          this.activeQuestion = null;
          this.isPaused = false;

          this.init();
        }

        init() {
          const canvas = document.getElementById('adventure-canvas');
          this.worldEngine = new AdventureWorldEngine(
            canvas,
            (gate) => this.triggerGateChallenge(gate),
            (crystal) => this.handleCrystalObtained(crystal)
          );

          this.loadStorage();
          this.bindEvents();

          // Game Animation Loop
          this.gameLoop = this.gameLoop.bind(this);
          requestAnimationFrame(this.gameLoop);
        }

        loadStorage() {
          try {
            const saved = localStorage.getItem('adventure_quest_save');
            if (saved) {
              const data = JSON.parse(saved);
              this.coins = data.coins || 0;
              this.crystalsUnlocked = data.crystalsUnlocked || 0;
              this.currentWorldIdx = data.worldIndex || 0;
              this.currentCategory = data.category || 'math';

              document.getElementById('coin-counter').innerText = this.coins;
              this.updateCrystalHUD();
            }
          } catch(e) {}
        }

        saveStorage() {
          try {
            const data = {
              coins: this.coins,
              crystalsUnlocked: this.crystalsUnlocked,
              worldIndex: this.currentWorldIdx,
              category: this.currentCategory
            };
            localStorage.setItem('adventure_quest_save', JSON.stringify(data));
          } catch(e) {}
        }

        addCoin() {
          this.coins++;
          document.getElementById('coin-counter').innerText = this.coins;
          this.saveStorage();
        }

        updateCrystalHUD() {
          const dots = document.querySelectorAll('#crystal-dots .c-dot');
          dots.forEach((dot, idx) => {
            if (idx < this.crystalsUnlocked) dot.classList.add('unlocked');
            else dot.classList.remove('unlocked');
          });
        }

        bindEvents() {
          // Tombol Mulai Petualangan di Menu
          document.getElementById('btn-start-quest')?.addEventListener('click', () => {
            document.getElementById('menu-screen').classList.add('hidden');
            this.worldEngine.loadWorld(this.currentWorldIdx);
            audio.speak("Selamat datang di Crystal Kingdom! Jelajahi wilayah dan temukan lima kristal kekuatan!");
          });

          // Pilihan Chip Kategori Edukasi
          document.querySelectorAll('.chip-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
              e.currentTarget.classList.add('active');
              this.currentCategory = e.currentTarget.getAttribute('data-cat');
              this.saveStorage();
            });
          });

          // Tombol Home Menu
          document.getElementById('btn-back-home')?.addEventListener('click', () => {
            document.getElementById('menu-screen').classList.remove('hidden');
          });

          // Tombol Replay Suara
          document.getElementById('btn-repeat-voice')?.addEventListener('click', () => {
            audio.repeat();
          });

          document.getElementById('challenge-speech-bar')?.addEventListener('click', () => {
            audio.repeat();
          });

          // Tombol Ganti Mode Cepat (Balap Mobil vs Petualangan)
          document.getElementById('btn-switch-game-mode')?.addEventListener('click', () => {
            const isRacing = confirm("Mau ganti ke mode Alphabet Racing Adventure (Balap Mobil) sekarang?");
            if (isRacing) {
              window.location.reload();
            }
          });

          // Tombol Lanjut Wilayah Berikutnya
          document.getElementById('btn-next-world')?.addEventListener('click', () => {
            document.getElementById('victory-modal').classList.add('hidden');
            this.currentWorldIdx = (this.currentWorldIdx + 1) % WORLDS.length;
            this.worldEngine.loadWorld(this.currentWorldIdx);
          });

          // Kontrol Layar Sentuh HP (Kiri, Kanan, Lompat)
          const setKey = (k, v) => { this.worldEngine.keys[k] = v; };

          const bindTouch = (id, keyName) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); setKey(keyName, true); }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); setKey(keyName, false); });
            el.addEventListener('mousedown', () => setKey(keyName, true));
            window.addEventListener('mouseup', () => setKey(keyName, false));
          };

          bindTouch('btn-move-left', 'left');
          bindTouch('btn-move-right', 'right');
          bindTouch('btn-jump', 'jump');

          // Tombol Interaksi Buka Peti / Gerbang
          document.getElementById('btn-interact')?.addEventListener('click', () => {
            if (this.activeGate && !this.activeGate.isOpen) {
              this.showChallengeUI();
            }
          });

          // Keyboard Arrows & WASD (Pengujian di Komputer)
          window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setKey('left', true);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setKey('right', true);
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') setKey('jump', true);
            if (e.key === 'e' || e.key === 'E') {
              if (this.activeGate && !this.activeGate.isOpen) this.showChallengeUI();
            }
          });

          window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setKey('left', false);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setKey('right', false);
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') setKey('jump', false);
          });
        }

        // ================= TANTANGAN EDUKASI STATE MACHINE ================= //
        triggerGateChallenge(gate) {
          this.activeGate = gate;
          this.showChallengeUI();
        }

        showChallengeUI() {
          this.isPaused = true;

          // Ambil kumpulan soal sesuai kategori aktif
          const qList = EDUCATION_DATABASE[this.currentCategory] || EDUCATION_DATABASE.math;
          const q = qList[Math.floor(Math.random() * qList.length)];
          this.activeQuestion = q;

          document.getElementById('challenge-category-label').innerText = `Kategori: ${this.currentCategory.toUpperCase()}`;
          document.getElementById('challenge-prompt-text').innerText = q.q;

          // Render Pilihan Jawaban
          const container = document.getElementById('challenge-choices-container');
          container.innerHTML = '';

          q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'choice-option-btn';
            btn.innerText = opt;

            btn.addEventListener('click', () => {
              this.handleAnswerCheck(opt, q, btn);
            });

            container.appendChild(btn);
          });

          document.getElementById('challenge-modal').classList.remove('hidden');
          audio.speak(q.q);
        }

        handleAnswerCheck(selected, qData, btnElem) {
          if (selected === qData.answer) {
            // Jawaban Benar!
            btnElem.classList.add('card-correct');
            audio.speak("Benar sekali! Pintar! Gerbang berhasil kamu buka!", () => {
              setTimeout(() => {
                document.getElementById('challenge-modal').classList.add('hidden');
                this.isPaused = false;
                if (this.activeGate) this.activeGate.isOpen = true;
              }, 400);
            });
          } else {
            // Jawaban Salah: Tetap di tempat, jangan ganti soal!
            audio.playWrong();
            btnElem.classList.add('card-shake');
            setTimeout(() => btnElem.classList.remove('card-shake'), 500);
            audio.speak("Yuk coba lagi ya! " + (qData.hint || 'Perhatikan baik-baik.'));
          }
        }

        handleCrystalObtained(crystal) {
          this.isPaused = true;
          this.crystalsUnlocked++;
          this.saveStorage();
          this.updateCrystalHUD();

          const vModal = document.getElementById('victory-modal');
          const vDesc = document.getElementById('victory-desc');
          vDesc.innerText = `Hebat sekali! Kamu berhasil mendapatkan ${crystal.name}!`;
          vModal.classList.remove('hidden');

          audio.speak(`Horeee! Selamat! ${crystal.name} berhasil kamu amankan! Kerajaan Crystal semakin damai!`);
        }

        gameLoop() {
          this.worldEngine.updatePhysics(this.isPaused);
          this.worldEngine.draw();
          requestAnimationFrame(this.gameLoop);
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        window.questApp = new AdventureQuestApp();
      });

    })();
  </script>
