<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spider-Hero & Obby Roblox Kids — Eksplorasi Bebas</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕷️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
  
  <!-- Three.js (3D Engine untuk Roblox Obby & Spiderman) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      background: #0f172a;
      touch-action: none;
    }

    #game-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 3D WebGL Canvas */
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* ================= 1. TOP HUD (STATUS & AUDIO) ================= */
    .top-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 10px) 14px 6px;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }

    .btn-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3), inset 0 -4px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s ease;
    }
    .btn-circle:active { transform: scale(0.9); }
    .btn-home { border-color: #f59e0b; background: #fef08a; }
    .btn-speaker { border-color: #10b981; background: #bbf7d0; animation: pulseBtn 1.8s infinite alternate; }

    @keyframes pulseBtn {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #f59e0b;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 800;
      color: #b45309;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    /* Mode Selector Pill di Atas */
    .mode-switch-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 3px solid #38bdf8;
      border-radius: 30px;
      padding: 4px;
      display: flex;
      gap: 4px;
      pointer-events: auto;
    }

    .mode-pill-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mode-pill-btn.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
    }

    /* ================= 2. SPIDERMAN WEB-SHOOTER & KONTROL HP ================= */
    .mobile-controls-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      pointer-events: none;
    }

    /* Joystick Virtual Kiri */
    .virtual-joystick-base {
      position: absolute;
      bottom: 24px;
      left: 20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 4px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
    }

    .virtual-joystick-thumb {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #38bdf8;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: absolute;
      pointer-events: none;
    }

    /* Tombol Aksi Kanan (Lompat / Tembak Jaring / Panjat Gedung) */
    .action-buttons-group {
      position: absolute;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }

    .action-btn-large {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 5px solid #ffffff;
      color: #ffffff;
      font-size: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      transition: transform 0.1s ease;
      font-family: inherit;
    }
    .action-btn-large:active { transform: scale(0.9); }
    .action-btn-large span { font-size: 10px; font-weight: 800; margin-top: -2px; }

    .btn-jump { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-web-sling { background: linear-gradient(135deg, #ef4444, #b91c1c); }

    /* Petunjuk Banner Ringan Saat Eksplorasi */
    .explore-hint-banner {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(6px);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 30px;
      border: 2px solid #38bdf8;
      font-size: 14px;
      font-weight: 700;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* ================= 3. POPUP TANTANGAN INTERAKTIF (HANYA MUNCUL DI GERBANG / PUNCAK) ================= */
    #challenge-overlay-card {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 440px;
      z-index: 60;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border: 5px solid #ef4444;
      border-radius: 32px;
      padding: 16px 18px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: popBounceCard 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popBounceCard {
      0% { transform: translate(-50%, 40px) scale(0.8); opacity: 0; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }

    .challenge-speech-bar {
      width: 100%;
      background: #fef2f2;
      border: 3px solid #f87171;
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .speech-icon { font-size: 26px; }
    .speech-text {
      font-size: 15px;
      font-weight: 800;
      color: #991b1b;
      line-height: 1.25;
    }

    .choices-bubble-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .bubble-choice-btn {
      flex: 1;
      aspect-ratio: 1;
      max-height: 84px;
      background: #ffffff;
      border: 4px solid #38bdf8;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15), inset 0 -4px 0 #bae6fd;
      transition: transform 0.1s ease;
    }
    .bubble-choice-btn:active { transform: scale(0.92); }
    .choice-main-char { font-size: 38px; font-weight: 800; color: #0284c7; line-height: 1; }
    .choice-main-char.arabic { font-family: 'Amiri', serif; font-size: 46px; color: #059669; }
    .choice-sub-text { font-size: 11px; font-weight: 700; color: #64748b; margin-top: 2px; }

    /* ================= 4. POPUP PERAYAAN BINTANG & LEVEL UP ================= */
    #celebration-popup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }

    .celebration-box {
      background: #ffffff;
      color: #1e293b;
      border-radius: 36px;
      border: 6px solid #f59e0b;
      padding: 28px 24px;
      width: 90%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: popAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popAnim {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .star-hero-big { font-size: 80px; animation: heroBounce 1.5s infinite ease-in-out; }
    @keyframes heroBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .btn-super-next {
      margin-top: 18px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      border: 4px solid #ffffff;
      border-radius: 30px;
      font-size: 20px;
      font-weight: 800;
      padding: 14px 36px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4);
      font-family: inherit;
    }
    .btn-super-next:active { transform: scale(0.95); }

    /* ================= 5. START MENU MODES ================= */
    #start-modal-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 120;
      background: linear-gradient(180deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #ffffff;
    }

    .menu-avatar-duo {
      font-size: 72px;
      display: flex;
      gap: 16px;
      margin-bottom: 8px;
      animation: floatDuo 2s infinite ease-in-out;
    }
    @keyframes floatDuo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .menu-main-title {
      font-size: 28px;
      font-weight: 800;
      text-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .menu-main-sub {
      font-size: 15px;
      font-weight: 600;
      opacity: 0.95;
      margin-top: 4px;
      margin-bottom: 24px;
    }

    .mode-cards-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }

    .btn-card-mode {
      border: 4px solid #ffffff;
      border-radius: 26px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      font-family: inherit;
      color: #ffffff;
      text-align: left;
      transition: transform 0.12s ease;
    }
    .btn-card-mode:active { transform: scale(0.95); }
    .mode-spiderman { background: linear-gradient(135deg, #ef4444, #991b1b); }
    .mode-roblox { background: linear-gradient(135deg, #38bdf8, #0284c7); }
    .mode-hijaiyah-park { background: linear-gradient(135deg, #10b981, #047857); }

    .card-mode-icon { font-size: 40px; }
    .card-mode-info h4 { font-size: 18px; font-weight: 800; }
    .card-mode-info p { font-size: 12px; opacity: 0.9; font-weight: 600; margin-top: 2px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game-viewport">
    
    <!-- Canvas 3D Three.js -->
    <canvas id="three-canvas"></canvas>

    <!-- Top HUD (Score & Replay Voice) -->
    <header class="top-hud">
      <div class="hud-group">
        <button id="btn-back-home" class="btn-circle btn-home" title="Pilih Mode">🏠</button>
        <button id="btn-repeat-speech" class="btn-circle btn-speaker" title="Ulangi Suara">🔊</button>
      </div>

      <!-- Mode Switch Pill Cepat -->
      <div class="mode-switch-pill">
        <button class="mode-pill-btn active" data-mode="spiderman">🕷️ Spider</button>
        <button class="mode-pill-btn" data-mode="roblox">🧱 Obby</button>
        <button class="mode-pill-btn" data-mode="hijaiyah">📖 Hijaiyah</button>
      </div>

      <div class="hud-group">
        <div class="stat-pill">
          <span>⭐</span>
          <span id="star-counter">0</span>
        </div>
      </div>
    </header>

    <!-- Banner Ringan Saat Anak Sedang Eksplorasi Bebas -->
    <div id="explore-banner" class="explore-hint-banner">
      <span id="explore-banner-icon">🎮</span>
      <span id="explore-banner-text">Ayo jalan-jalan bebas! Panjat gedung atau lewati balok!</span>
    </div>

    <!-- Kontrol Sentuh HP (Joystick Kiri & Tombol Aksi Kanan) -->
    <div class="mobile-controls-layer">
      <!-- Virtual Joystick Touch Kiri -->
      <div id="joystick-base" class="virtual-joystick-base">
        <div id="joystick-thumb" class="virtual-joystick-thumb"></div>
      </div>

      <!-- Tombol Aksi Kanan (Lompat Obby & Tembak Jaring Spiderman) -->
      <div class="action-buttons-group">
        <button id="btn-shoot-web" class="action-btn-large btn-web-sling">
          🕸️
          <span>JARING</span>
        </button>
        <button id="btn-hero-jump" class="action-btn-large btn-jump">
          ⬆️
          <span>LOMPAT</span>
        </button>
      </div>
    </div>

    <!-- Zona Tantangan Edukasi Interaktif (HANYA MUNCUL KETIKA TIBA DI TARGET/PUNCAK) -->
    <div id="challenge-overlay-card" class="hidden">
      <div class="challenge-speech-bar" id="speech-trigger-box">
        <span class="speech-icon">🔊</span>
        <span class="speech-text" id="challenge-prompt-text">
          Ayo sentuh huruf yang benar untuk membuka peti rahasia!
        </span>
      </div>

      <div class="choices-bubble-row" id="choices-container">
        <!-- Pilihan Huruf Kartu di-render dinamis -->
      </div>
    </div>

    <!-- Popup Perayaan Kemenangan Bintang Hero -->
    <div id="celebration-popup" class="hidden">
      <div class="celebration-box">
        <div class="star-hero-big">🦸‍♂️✨</div>
        <h2 style="font-size: 24px; font-weight: 800; color: #ef4444; margin-top: 10px;">HEBAT BANGET!</h2>
        <p id="celebration-detail" style="font-size: 15px; color: #64748b; font-weight: 600; margin-top: 6px;">
          Spider-Hero berhasil memanjat puncak gedung!
        </p>
        <button id="btn-next-mission" class="btn-super-next">Main Lagi! 🚀</button>
      </div>
    </div>

    <!-- Menu Utama Pilihan Dunia -->
    <div id="start-modal-screen">
      <div class="menu-avatar-duo">
        <span>🕷️</span>
        <span>🧱</span>
      </div>
      <h1 class="menu-main-title">Petualangan Hero Kids</h1>
      <p class="menu-main-sub">Spiderman Memanjat Gedung & Obby Roblox Seru</p>

      <div class="mode-cards-container">
        <!-- Mode 1: Spiderman Memanjat Gedung -->
        <button class="btn-card-mode mode-spiderman" data-gamemode="spiderman">
          <span class="card-mode-icon">🕷️</span>
          <div class="card-mode-info">
            <h4>Spider-Hero Panjat Gedung</h4>
            <p>Main bebas, jalan-jalan, tembak jaring & panjat menara</p>
          </div>
        </button>

        <!-- Mode 2: Roblox Obby Parkour -->
        <button class="btn-card-mode mode-roblox" data-gamemode="roblox">
          <span class="card-mode-icon">🧱</span>
          <div class="card-mode-info">
            <h4>Roblox Obby Parkour</h4>
            <p>Main bebas lompat platform balok warna-warni</p>
          </div>
        </button>

        <!-- Mode 3: Petualangan Hijaiyah 3D -->
        <button class="btn-card-mode mode-hijaiyah-park" data-gamemode="hijaiyah">
          <span class="card-mode-icon">🕌</span>
          <div class="card-mode-info">
            <h4>Taman Hijaiyah Hero</h4>
            <p>Jalan-jalan di kota suci menemukan bintang huruf</p>
          </div>
        </button>
      </div>
    </div>

  </div>

  <!-- ==========================================================================
       SCRIPT ENGINE 3D THREE.JS: EKSPLORASI BEBAS DULU, TANTANGAN MUNCUL DI TARGET
       ========================================================================== -->
  <script>
    (function() {
      'use strict';

      // ----------------------------------------------------------------------
      // 1. DATA MISI EDUKASI
      // ----------------------------------------------------------------------
      const SPIDER_MISSIONS = [
        { letter: 'A', name: 'A', word: 'Apel', desc: 'Kamu sampai di atas gedung! Mana huruf A untuk Apel?' },
        { letter: 'B', name: 'B', word: 'Bola', desc: 'Kamu sampai di atas gedung! Mana huruf B untuk Bola?' },
        { letter: 'C', name: 'C', word: 'Ceri', desc: 'Kamu sampai di atas gedung! Mana huruf C untuk Ceri?' },
        { letter: 'D', name: 'D', word: 'Donat', desc: 'Kamu sampai di atas gedung! Mana huruf D untuk Donat?' },
        { letter: 'E', name: 'E', word: 'Elang', desc: 'Kamu sampai di atas gedung! Mana huruf E untuk Elang?' },
        { letter: 'F', name: 'F', word: 'Flamingo', desc: 'Kamu sampai di atas gedung! Mana huruf F untuk Flamingo?' }
      ];

      const ROBLOX_OBBY_MISSIONS = [
        { letter: 'G', name: 'G', word: 'Gajah', desc: 'Hore sampai di garis akhir! Mana balok huruf G?' },
        { letter: 'H', name: 'H', word: 'Harimau', desc: 'Hore sampai di garis akhir! Mana balok huruf H?' },
        { letter: 'I', name: 'I', word: 'Ikan', desc: 'Hore sampai di garis akhir! Mana balok huruf I?' },
        { letter: 'J', name: 'J', word: 'Jerapah', desc: 'Hore sampai di garis akhir! Mana balok huruf J?' },
        { letter: 'K', name: 'K', word: 'Kelinci', desc: 'Hore sampai di garis akhir! Mana balok huruf K?' },
        { letter: 'L', name: 'L', word: 'Lumba-lumba', desc: 'Hore sampai di garis akhir! Mana balok huruf L?' }
      ];

      const HIJAIYAH_MISSIONS = [
        { id: 'alif', arabic: 'ا', name: 'Alif', desc: 'Selamat datang di puncak menara! Mana huruf Alif?' },
        { id: 'ba', arabic: 'ب', name: 'Ba', desc: 'Selamat datang di puncak menara! Mana huruf Ba dengan titik di bawah?' },
        { id: 'ta', arabic: 'ت', name: 'Ta', desc: 'Selamat datang di puncak menara! Mana huruf Ta dengan dua titik di atas?' },
        { id: 'tsa', arabic: 'ث', name: 'Tsa', desc: 'Selamat datang di puncak menara! Mana huruf Tsa dengan tiga titik?' },
        { id: 'jim', arabic: 'ج', name: 'Jim', desc: 'Selamat datang di puncak menara! Mana huruf Jim dengan titik di perut?' },
        { id: 'ha', arabic: 'ح', name: 'Ha', desc: 'Selamat datang di puncak menara! Mana huruf Ha tanpa titik?' }
      ];

      // ----------------------------------------------------------------------
      // 2. SISTEM SUARA & EFEK SFX
      // ----------------------------------------------------------------------
      class SoundEngine {
        constructor() {
          this.synth = window.speechSynthesis || null;
          this.audioCtx = null;
          this.lastSpeech = '';
          this.unlocked = false;
          this.initVoice();
        }

        unlock() {
          if (this.unlocked) return;
          try {
            const ACtx = window.AudioContext || window.webkitAudioContext;
            if (ACtx) {
              this.audioCtx = new ACtx();
              if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            }
            if (this.synth) this.synth.speak(new SpeechSynthesisUtterance(''));
            this.unlocked = true;
          } catch(e) {}
        }

        initVoice() {
          if (!this.synth) return;
          const setV = () => {
            const voices = this.synth.getVoices() || [];
            this.idVoice = voices.find(v => v.lang && (v.lang.includes('id') || v.lang.includes('ID'))) || null;
          };
          setV();
          if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = setV;
          }
        }

        speak(text, onEnd) {
          if (!text) { if (onEnd) onEnd(); return; }
          this.lastSpeech = text;
          if (!this.synth) { if (onEnd) setTimeout(onEnd, 1000); return; }

          try { this.synth.cancel(); } catch(e) {}
          try {
            const utter = new SpeechSynthesisUtterance(text);
            if (this.idVoice) utter.voice = this.idVoice;
            utter.lang = 'id-ID';
            utter.rate = 0.9;
            utter.pitch = 1.25;
            utter.onend = () => { if (onEnd) onEnd(); };
            utter.onerror = () => { if (onEnd) onEnd(); };
            this.synth.speak(utter);
          } catch(e) {
            if (onEnd) onEnd();
          }
        }

        repeat() {
          if (this.lastSpeech) {
            this.playTap();
            this.speak(this.lastSpeech);
          }
        }

        _getCtx() {
          if (!this.audioCtx) {
            const ACtx = window.AudioContext || window.webkitAudioContext;
            if (ACtx) this.audioCtx = new ACtx();
          }
          if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();
          return this.audioCtx;
        }

        playWebThwip() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(700, t);
            osc.frequency.exponentialRampToValueAtTime(2400, t + 0.12);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.14);
          } catch(e) {}
        }

        playJumpBoing() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(240, t);
            osc.frequency.exponentialRampToValueAtTime(620, t + 0.15);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.16);
          } catch(e) {}
        }

        playVictory() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
              const osc = c.createOscillator();
              const gain = c.createGain();
              const st = t + idx * 0.08;
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, st);
              gain.gain.setValueAtTime(0.25, st);
              gain.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
              osc.connect(gain);
              gain.connect(c.destination);
              osc.start(st);
              osc.stop(st + 0.35);
            });
          } catch (e) {}
        }

        playTap() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, t);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.05);
          } catch(e) {}
        }

        playSoftTryAgain() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.linearRampToValueAtTime(320, t + 0.2);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.25);
          } catch (e) {}
        }
      }

      // 3. ENGINE 3D TAMPILAN THREE.JS
      // ----------------------------------------------------------------------
      class ThreeDWorldManager {
        constructor(canvas, onTargetReached) {
          this.canvas = canvas;
          this.onTargetReached = onTargetReached;
          this.scene = null;
          this.camera = null;
          this.renderer = null;

          // Karakter 3D
          this.characterGroup = null;
          this.characterType = 'spiderman';
          this.isClimbing = false;
          this.isJumping = false;
          this.webLine = null;

          // Target Puncak / Akhir Obby
          this.targetMesh = null;
          this.hasTriggeredTarget = false;

          // Grup Dunia
          this.environmentGroup = new THREE.Group();

          this.initThree();
          this.animate = this.animate.bind(this);
          requestAnimationFrame(this.animate);
        }

        initThree() {
          const width = window.innerWidth;
          const height = window.innerHeight;

          this.scene = new THREE.Scene();
          this.scene.background = new THREE.Color('#38bdf8');

          this.camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
          this.camera.position.set(0, 5, 11);
          this.camera.lookAt(0, 2, 0);

          this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
          this.renderer.setSize(width, height);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

          const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
          hemiLight.position.set(0, 20, 0);
          this.scene.add(hemiLight);

          const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
          dirLight.position.set(10, 20, 10);
          this.scene.add(dirLight);

          this.scene.add(this.environmentGroup);

          this.buildCharacter('spiderman');
          this.buildCityEnvironment();

          window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            this.camera.aspect = w / h;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(w, h);
          });
        }

        buildCharacter(type) {
          if (this.characterGroup) this.scene.remove(this.characterGroup);
          this.characterType = type;
          this.characterGroup = new THREE.Group();

          if (type === 'spiderman') {
            const redMat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
            const blueMat = new THREE.MeshLambertMaterial({ color: 0x1d4ed8 });

            const bodyGeo = new THREE.BoxGeometry(0.8, 1.0, 0.5);
            const spideyBody = new THREE.Mesh(bodyGeo, redMat);
            spideyBody.position.y = 0.5;
            this.characterGroup.add(spideyBody);

            const headGeo = new THREE.SphereGeometry(0.45, 16, 16);
            const head = new THREE.Mesh(headGeo, redMat);
            head.position.y = 1.35;
            this.characterGroup.add(head);

            const eyeGeo = new THREE.BoxGeometry(0.18, 0.1, 0.05);
            const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const leftEye = new THREE.Mesh(eyeGeo, whiteMat);
            leftEye.position.set(-0.16, 1.35, 0.42);
            leftEye.rotation.z = 0.2;
            const rightEye = new THREE.Mesh(eyeGeo, whiteMat);
            rightEye.position.set(0.16, 1.35, 0.42);
            rightEye.rotation.z = -0.2;
            this.characterGroup.add(leftEye, rightEye);

            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.35);
            const leftLeg = new THREE.Mesh(legGeo, blueMat);
            leftLeg.position.set(-0.25, -0.4, 0);
            const rightLeg = new THREE.Mesh(legGeo, blueMat);
            rightLeg.position.set(0.25, -0.4, 0);
            this.characterGroup.add(leftLeg, rightLeg);

          } else {
            const yellowMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
            const blueMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
            const greenMat = new THREE.MeshLambertMaterial({ color: 0x22c55e });

            const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            const head = new THREE.Mesh(headGeo, yellowMat);
            head.position.y = 1.45;
            this.characterGroup.add(head);

            const bodyGeo = new THREE.BoxGeometry(1.0, 1.0, 0.5);
            const robloxBody = new THREE.Mesh(bodyGeo, blueMat);
            robloxBody.position.y = 0.5;
            this.characterGroup.add(robloxBody);

            const legGeo = new THREE.BoxGeometry(0.45, 0.9, 0.45);
            const leftLeg = new THREE.Mesh(legGeo, greenMat);
            leftLeg.position.set(-0.26, -0.45, 0);
            const rightLeg = new THREE.Mesh(legGeo, greenMat);
            rightLeg.position.set(0.26, -0.45, 0);
            this.characterGroup.add(leftLeg, rightLeg);
          }

          this.characterGroup.position.set(0, 0.8, 0);
          this.scene.add(this.characterGroup);
        }

        buildCityEnvironment() {
          this.hasTriggeredTarget = false;
          while (this.environmentGroup.children.length > 0) {
            this.environmentGroup.remove(this.environmentGroup.children[0]);
          }

          // Lantai Jalan Luas (Anak Bebas Berlari)
          const groundGeo = new THREE.PlaneGeometry(100, 100);
          groundGeo.rotateX(-Math.PI / 2);
          const groundMat = new THREE.MeshLambertMaterial({ color: 0x86efac });
          const ground = new THREE.Mesh(groundGeo, groundMat);
          ground.position.y = -0.5;
          this.environmentGroup.add(ground);

          if (this.characterType === 'spiderman') {
            // GEDUNG BESAR DI DEPAN UNTUK DIPANJAT KAPAN SAJA
            const towerGeo = new THREE.BoxGeometry(5.5, 16, 5.5);
            const towerMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
            const tower = new THREE.Mesh(towerGeo, towerMat);
            tower.position.set(0, 7.5, -4);
            this.environmentGroup.add(tower);

            // Jendela-jendela
            for (let y = 1; y < 14; y += 2) {
              for (let x = -1.6; x <= 1.6; x += 1.6) {
                const winGeo = new THREE.PlaneGeometry(0.8, 1.0);
                const winMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
                const win = new THREE.Mesh(winGeo, winMat);
                win.position.set(x, y, -1.22);
                this.environmentGroup.add(win);
              }
            }

            // Bintang Emas Puncak Gedung
            const starGeo = new THREE.OctahedronGeometry(0.9);
            const starMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            this.targetMesh = new THREE.Mesh(starGeo, starMat);
            this.targetMesh.position.set(0, 16.2, -4);
            this.environmentGroup.add(this.targetMesh);

          } else {
            // ROBLOX OBBY PLATFORM BALOK WARNA-WARNI
            const colors = [0xef4444, 0xf59e0b, 0x10b981, 0x3b82f6, 0x8b5cf6];
            for (let i = 0; i < 6; i++) {
              const platGeo = new THREE.BoxGeometry(3, 0.5, 3);
              const platMat = new THREE.MeshLambertMaterial({ color: colors[i % colors.length] });
              const plat = new THREE.Mesh(platGeo, platMat);
              plat.position.set((i % 2 === 0 ? 1 : -1) * 1.6, i * 1.5, -i * 2.8);
              this.environmentGroup.add(plat);
            }

            // Bintang Finish Obby di Platform Terakhir
            const starGeo = new THREE.OctahedronGeometry(0.9);
            const starMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            this.targetMesh = new THREE.Mesh(starGeo, starMat);
            this.targetMesh.position.set(-1.6, 5 * 1.5 + 1.2, -5 * 2.8);
            this.environmentGroup.add(this.targetMesh);
          }
        }

        // Tembak Jaring Bebas & Panjat
        shootWebAndClimb() {
          if (this.isClimbing) return;
          sounds.playWebThwip();
          this.isClimbing = true;

          // Buat Tali Jaring Laba-laba 3D
          if (this.webLine) this.scene.remove(this.webLine);
          const points = [
            new THREE.Vector3(this.characterGroup.position.x, this.characterGroup.position.y + 1, this.characterGroup.position.z),
            new THREE.Vector3(0, 15.5, -4)
          ];
          const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
          const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 4 });
          this.webLine = new THREE.Line(lineGeo, lineMat);
          this.scene.add(this.webLine);

          // Panjat ke Atas Gedung
          const climbInterval = setInterval(() => {
            if (this.characterGroup.position.y < 15.5) {
              this.characterGroup.position.y += 0.35;
              this.characterGroup.position.z -= 0.08;
              this.characterGroup.rotation.y += 0.18;
              this.camera.position.y = this.characterGroup.position.y + 4;
            } else {
              clearInterval(climbInterval);
              this.isClimbing = false;
              if (this.webLine) {
                this.scene.remove(this.webLine);
                this.webLine = null;
              }
              // Karakter tiba di puncak gedung! Munculkan kuis huruf
              if (!this.hasTriggeredTarget) {
                this.hasTriggeredTarget = true;
                if (this.onTargetReached) this.onTargetReached();
              }
            }
          }, 30);
        }

        // Lompat Bebas (Bisa Ditekan Kapan Saja)
        jumpAction() {
          if (this.isJumping || this.isClimbing) return;
          sounds.playJumpBoing();
          this.isJumping = true;
          let velY = 0.35;
          const origY = this.characterGroup.position.y;

          const jumpLoop = setInterval(() => {
            this.characterGroup.position.y += velY;
            this.characterGroup.position.z -= 0.05; // Sedikit maju saat lompat
            velY -= 0.03;

            // Periksa jika mendekati finish obby
            if (this.characterType === 'roblox' && this.characterGroup.position.z <= -12 && !this.hasTriggeredTarget) {
              this.hasTriggeredTarget = true;
              if (this.onTargetReached) this.onTargetReached();
            }

            if (this.characterGroup.position.y <= origY) {
              this.characterGroup.position.y = origY;
              this.isJumping = false;
              clearInterval(jumpLoop);
            }
          }, 30);
        }

        resetCharacterPosition() {
          this.hasTriggeredTarget = false;
          this.characterGroup.position.set(0, 0.8, 0);
          this.characterGroup.rotation.set(0, 0, 0);
          this.camera.position.set(0, 5, 11);
          this.camera.lookAt(0, 2, 0);
        }

        animate() {
          requestAnimationFrame(this.animate);

          // Animasi Bintang Target Berputar Menarik Perhatian Anak
          if (this.targetMesh) {
            this.targetMesh.rotation.y += 0.03;
            this.targetMesh.rotation.x += 0.02;
          }

          this.renderer.render(this.scene, this.camera);
        }
      }

      // 4. CONTROLLER GAME PLAY-FIRST (MAIN DULU, BARU TANYA)

      class SuperheroGameApp {
        constructor() {
          this.world3D = null;
          this.activeMode = 'spiderman';
          this.currentMissionIndex = 0;
          this.starScore = 0;
          this.canAnswer = false;
          this.isQuestionActive = false;

          this.init();
        }

        init() {
          const canvas = document.getElementById('three-canvas');
          // Callback saat anak berhasil memanjat puncak gedung atau menyelesaikan obby!
          this.world3D = new ThreeDWorldManager(canvas, () => {
            this.triggerQuestionAtTarget();
          });

          this.bindControls();
          this.loadScore();
        }

        loadScore() {
          try {
            const s = localStorage.getItem('spider_kids_stars');
            if (s) this.starScore = parseInt(s, 10) || 0;
            document.getElementById('star-counter').innerText = this.starScore;
          } catch(e) {}
        }

        addScore() {
          this.starScore++;
          try {
            localStorage.setItem('spider_kids_stars', this.starScore);
          } catch(e) {}
          document.getElementById('star-counter').innerText = this.starScore;
        }

        bindControls() {
          // Tombol Pilih Mode di Start Menu
          document.querySelectorAll('.btn-card-mode').forEach(btn => {
            btn.addEventListener('click', (e) => {
              sounds.unlock();
              sounds.playTap();
              const mode = e.currentTarget.getAttribute('data-gamemode');
              document.getElementById('start-modal-screen').classList.add('hidden');
              this.setGameMode(mode);
            });
          });

          // Switch Mode Cepat di Bar Atas
          document.querySelectorAll('.mode-pill-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              sounds.playTap();
              const mode = e.currentTarget.getAttribute('data-mode');
              document.querySelectorAll('.mode-pill-btn').forEach(b => b.classList.remove('active'));
              e.currentTarget.classList.add('active');
              this.setGameMode(mode);
            });
          });

          // Tombol Home
          document.getElementById('btn-back-home')?.addEventListener('click', () => {
            sounds.playTap();
            document.getElementById('start-modal-screen').classList.remove('hidden');
            this.hideQuestionCard();
          });

          // Tombol Replay Suara
          document.getElementById('btn-repeat-speech')?.addEventListener('click', () => {
            sounds.repeat();
          });

          document.getElementById('speech-trigger-box')?.addEventListener('click', () => {
            sounds.repeat();
          });

          // AKSI BEBAS: Tembak Jaring Spiderman (Anak Bebas Memanjat Kapan Saja!)
          document.getElementById('btn-shoot-web')?.addEventListener('click', () => {
            this.world3D.shootWebAndClimb();
          });

          // AKSI BEBAS: Lompat Karakter (Anak Bebas Melompat Kapan Saja!)
          document.getElementById('btn-hero-jump')?.addEventListener('click', () => {
            this.world3D.jumpAction();
          });

          // Tombol Main Lagi di Popup
          document.getElementById('btn-next-mission')?.addEventListener('click', () => {
            sounds.playTap();
            document.getElementById('celebration-popup').classList.add('hidden');
            this.nextPlayRound();
          });

          // Joystick Sentuh Virtual untuk HP
          this.initJoystick();
        }

        initJoystick() {
          const base = document.getElementById('joystick-base');
          const thumb = document.getElementById('joystick-thumb');
          let isTouching = false;
          let startX = 0, startY = 0;

          const handleStart = (e) => {
            isTouching = true;
            const touch = e.touches ? e.touches[0] : e;
            const rect = base.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
          };

          const handleMove = (e) => {
            if (!isTouching) return;
            const touch = e.touches ? e.touches[0] : e;
            let dx = touch.clientX - startX;
            let dy = touch.clientY - startY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxRadius = 35;

            if (dist > maxRadius) {
              dx = (dx / dist) * maxRadius;
              dy = (dy / dist) * maxRadius;
            }

            thumb.style.transform = `translate(${dx}px, ${dy}px)`;

            // Gerakan Bebas Karakter 3D
            if (this.world3D.characterGroup && !this.world3D.isClimbing) {
              this.world3D.characterGroup.position.x += dx * 0.006;
              this.world3D.characterGroup.position.z += dy * 0.006;
              this.world3D.characterGroup.rotation.y = -Math.atan2(dy, dx) - Math.PI / 2;

              // Jika anak berjalan mendekati gedung/target secara manual
              if (this.world3D.characterGroup.position.z <= -3 && !this.world3D.hasTriggeredTarget && this.activeMode === 'spiderman') {
                // Anak menyentuh gedung, bantu otomatis memanjat
                this.world3D.shootWebAndClimb();
              }
            }
          };

          const handleEnd = () => {
            isTouching = false;
            thumb.style.transform = 'translate(0px, 0px)';
          };

          base.addEventListener('touchstart', handleStart, { passive: true });
          window.addEventListener('touchmove', handleMove, { passive: true });
          window.addEventListener('touchend', handleEnd);

          base.addEventListener('mousedown', handleStart);
          window.addEventListener('mousemove', handleMove);
          window.addEventListener('mouseup', handleEnd);
        }

        setGameMode(mode) {
          this.activeMode = mode;
          this.currentMissionIndex = 0;
          this.hideQuestionCard();
          this.world3D.buildCharacter(mode === 'roblox' ? 'roblox' : 'spiderman');
          this.world3D.buildCityEnvironment();
          this.world3D.resetCharacterPosition();

          // Sapaan Ceria Singkat di Awal Permainan
          const bannerText = document.getElementById('explore-banner-text');
          if (mode === 'spiderman') {
            bannerText.innerText = "Ayo main bebas! Tekan JARING untuk panjat gedung!";
            sounds.speak("Ayo main bebas! Tekan tombol jaring untuk memanjat gedung!");
          } else if (mode === 'roblox') {
            bannerText.innerText = "Ayo main bebas! Tekan LOMPAT untuk lewati balok!";
            sounds.speak("Ayo main bebas! Tekan tombol lompat untuk melewati rintangan!");
          } else {
            bannerText.innerText = "Ayo temukan bintang rahasia di menara suci!";
            sounds.speak("Ayo jalan-jalan dan temukan bintang rahasia!");
          }
        }

        hideQuestionCard() {
          this.isQuestionActive = false;
          this.canAnswer = false;
          document.getElementById('challenge-overlay-card')?.classList.add('hidden');
          document.getElementById('explore-banner')?.classList.remove('hidden');
        }

        // ================= KUIS HANYA MUNCUL KETIKA TIBA DI TARGET/PUNCAK ================= //
        triggerQuestionAtTarget() {
          this.isQuestionActive = true;
          this.canAnswer = true;

          document.getElementById('explore-banner')?.classList.add('hidden');
          const card = document.getElementById('challenge-overlay-card');
          card.classList.remove('hidden');

          const list = this.getCurrentList();
          const mission = list[this.currentMissionIndex % list.length];
          const isHijaiyah = (this.activeMode === 'hijaiyah');

          let choices = [mission];
          let others = list.filter(m => (isHijaiyah ? m.id !== mission.id : m.letter !== mission.letter));
          others.sort(() => Math.random() - 0.5);
          choices.push(others[0], others[1]);
          choices.sort(() => Math.random() - 0.5);

          const promptEl = document.getElementById('challenge-prompt-text');
          promptEl.innerText = mission.desc;
          sounds.speak(mission.desc);

          const container = document.getElementById('choices-container');
          container.innerHTML = '';

          choices.forEach(ch => {
            const btn = document.createElement('button');
            btn.className = 'bubble-choice-btn';

            if (isHijaiyah) {
              btn.innerHTML = `
                <span class="choice-main-char arabic">${ch.arabic}</span>
                <span class="choice-sub-text">${ch.name}</span>
              `;
            } else {
              btn.innerHTML = `
                <span class="choice-main-char">${ch.letter}</span>
                <span class="choice-sub-text">${ch.word}</span>
              `;
            }

            btn.addEventListener('click', () => {
              if (!this.canAnswer) return;
              this.handleChoiceAnswer(ch, mission, btn);
            });

            container.appendChild(btn);
          });
        }

        getCurrentList() {
          if (this.activeMode === 'roblox') return ROBLOX_OBBY_MISSIONS;
          if (this.activeMode === 'hijaiyah') return HIJAIYAH_MISSIONS;
          return SPIDER_MISSIONS;
        }

        handleChoiceAnswer(selected, target, btnElem) {
          sounds.playTap();
          const isCorrect = (this.activeMode === 'hijaiyah') ? (selected.id === target.id) : (selected.letter === target.letter);

          if (isCorrect) {
            this.canAnswer = false;
            this.addScore();
            btnElem.style.borderColor = '#10b981';
            btnElem.style.background = '#dcfce7';

            this.hideQuestionCard();
            this.showCelebrationPopup();

          } else {
            sounds.playSoftTryAgain();
            btnElem.style.transform = 'scale(0.88)';
            setTimeout(() => btnElem.style.transform = 'scale(1)', 200);
            sounds.speak("Yuk coba lagi! Cari huruf yang sesuai instruksi ya adik hebat!");
          }
        }

        showCelebrationPopup() {
          sounds.playVictory();
          const popup = document.getElementById('celebration-popup');
          const detail = document.getElementById('celebration-detail');

          if (this.activeMode === 'spiderman') {
            detail.innerText = "Yeeay! Spider-Hero berhasil memanjat puncak dan mendapatkan bintang emas!";
            sounds.speak("Horeee! Jawabanmu benar dan kamu mendapatkan bintang emas! Hebat sekali!");
          } else if (this.activeMode === 'roblox') {
            detail.innerText = "Keren sekali! Karakter Obby kamu berhasil parkour di platform balok huruf!";
            sounds.speak("Luar biasa! Kamu berhasil melewati rintangan Obby dan mendapatkan bintang!");
          } else {
            detail.innerText = "Alhamdulillah! Bintang huruf Hijaiyah berhasil kamu temukan!";
            sounds.speak("Alhamdulillah! Jawabanmu benar dan kamu dapat bintang baru!");
          }

          popup.classList.remove('hidden');
        }

        nextPlayRound() {
          this.currentMissionIndex++;
          this.hideQuestionCard();
          this.world3D.resetCharacterPosition();
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        window.heroGame = new SuperheroGameApp();
      });

    })();
  </script>
</body>
</html>
