<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spider-Hero & Obby Roblox Kids — Edukasi Pintar</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕷️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
  
  <!-- Three.js (3D Engine untuk Roblox Obby & Spiderman) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      background: #0f172a;
      touch-action: none;
    }

    #game-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 3D WebGL Canvas */
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* ================= 1. TOP HUD (STATUS & AUDIO) ================= */
    .top-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 10px) 14px 6px;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }

    .btn-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3), inset 0 -4px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s ease;
    }
    .btn-circle:active { transform: scale(0.9); }
    .btn-home { border-color: #f59e0b; background: #fef08a; }
    .btn-speaker { border-color: #10b981; background: #bbf7d0; animation: pulseBtn 1.8s infinite alternate; }

    @keyframes pulseBtn {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #f59e0b;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 800;
      color: #b45309;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    /* Mode Selector Pill di Atas */
    .mode-switch-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 3px solid #38bdf8;
      border-radius: 30px;
      padding: 4px;
      display: flex;
      gap: 4px;
      pointer-events: auto;
    }

    .mode-pill-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mode-pill-btn.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
    }

    /* ================= 2. SPIDERMAN WEB-SHOOTER & KONTROL HP ================= */
    .mobile-controls-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      pointer-events: none;
    }

    /* Joystick Virtual Kiri */
    .virtual-joystick-base {
      position: absolute;
      bottom: 24px;
      left: 20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 4px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
    }

    .virtual-joystick-thumb {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #38bdf8;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: absolute;
      pointer-events: none;
    }

    /* Tombol Aksi Kanan (Lompat / Tembak Jaring / Panjat Gedung) */
    .action-buttons-group {
      position: absolute;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }

    .action-btn-large {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 5px solid #ffffff;
      color: #ffffff;
      font-size: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      transition: transform 0.1s ease;
      font-family: inherit;
    }
    .action-btn-large:active { transform: scale(0.9); }
    .action-btn-large span { font-size: 10px; font-weight: 800; margin-top: -2px; }

    .btn-jump { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-web-sling { background: linear-gradient(135deg, #ef4444, #b91c1c); }

    /* ================= 3. ZONA TANTANGAN KUIS EDUKASI ROBLOX / SPIDER ================= */
    #challenge-overlay-card {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 440px;
      z-index: 60;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border: 5px solid #ef4444;
      border-radius: 32px;
      padding: 16px 18px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .challenge-speech-bar {
      width: 100%;
      background: #fef2f2;
      border: 3px solid #f87171;
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .speech-icon { font-size: 26px; }
    .speech-text {
      font-size: 15px;
      font-weight: 800;
      color: #991b1b;
      line-height: 1.25;
    }

    .choices-bubble-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .bubble-choice-btn {
      flex: 1;
      aspect-ratio: 1;
      max-height: 84px;
      background: #ffffff;
      border: 4px solid #38bdf8;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15), inset 0 -4px 0 #bae6fd;
      transition: transform 0.1s ease;
    }
    .bubble-choice-btn:active { transform: scale(0.92); }
    .choice-main-char { font-size: 38px; font-weight: 800; color: #0284c7; line-height: 1; }
    .choice-main-char.arabic { font-family: 'Amiri', serif; font-size: 46px; color: #059669; }
    .choice-sub-text { font-size: 11px; font-weight: 700; color: #64748b; margin-top: 2px; }

    /* ================= 4. POPUP PERAYAAN BINTANG & LEVEL UP ================= */
    #celebration-popup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }

    .celebration-box {
      background: #ffffff;
      color: #1e293b;
      border-radius: 36px;
      border: 6px solid #f59e0b;
      padding: 28px 24px;
      width: 90%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: popAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popAnim {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .star-hero-big { font-size: 80px; animation: heroBounce 1.5s infinite ease-in-out; }
    @keyframes heroBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .btn-super-next {
      margin-top: 18px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      border: 4px solid #ffffff;
      border-radius: 30px;
      font-size: 20px;
      font-weight: 800;
      padding: 14px 36px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4);
      font-family: inherit;
    }
    .btn-super-next:active { transform: scale(0.95); }

    /* ================= 5. START MENU MODES ================= */
    #start-modal-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 120;
      background: linear-gradient(180deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #ffffff;
    }

    .menu-avatar-duo {
      font-size: 72px;
      display: flex;
      gap: 16px;
      margin-bottom: 8px;
      animation: floatDuo 2s infinite ease-in-out;
    }
    @keyframes floatDuo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .menu-main-title {
      font-size: 28px;
      font-weight: 800;
      text-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .menu-main-sub {
      font-size: 15px;
      font-weight: 600;
      opacity: 0.95;
      margin-top: 4px;
      margin-bottom: 24px;
    }

    .mode-cards-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }

    .btn-card-mode {
      border: 4px solid #ffffff;
      border-radius: 26px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      font-family: inherit;
      color: #ffffff;
      text-align: left;
      transition: transform 0.12s ease;
    }
    .btn-card-mode:active { transform: scale(0.95); }
    .mode-spiderman { background: linear-gradient(135deg, #ef4444, #991b1b); }
    .mode-roblox { background: linear-gradient(135deg, #38bdf8, #0284c7); }
    .mode-hijaiyah-park { background: linear-gradient(135deg, #10b981, #047857); }

    .card-mode-icon { font-size: 40px; }
    .card-mode-info h4 { font-size: 18px; font-weight: 800; }
    .card-mode-info p { font-size: 12px; opacity: 0.9; font-weight: 600; margin-top: 2px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game-viewport">
    
    <!-- Canvas 3D Three.js -->
    <canvas id="three-canvas"></canvas>

    <!-- Top HUD (Score & Replay Voice) -->
    <header class="top-hud">
      <div class="hud-group">
        <button id="btn-back-home" class="btn-circle btn-home" title="Pilih Mode">🏠</button>
        <button id="btn-repeat-speech" class="btn-circle btn-speaker" title="Ulangi Suara">🔊</button>
      </div>

      <!-- Mode Switch Pill Cepat -->
      <div class="mode-switch-pill">
        <button class="mode-pill-btn active" data-mode="spiderman">🕷️ Spider</button>
        <button class="mode-pill-btn" data-mode="roblox">🧱 Obby</button>
        <button class="mode-pill-btn" data-mode="hijaiyah">📖 Hijaiyah</button>
      </div>

      <div class="hud-group">
        <div class="stat-pill">
          <span>⭐</span>
          <span id="star-counter">0</span>
        </div>
      </div>
    </header>

    <!-- Kontrol Sentuh HP (Joystick Kiri & Tombol Aksi Kanan) -->
    <div class="mobile-controls-layer">
      <!-- Virtual Joystick Touch Kiri -->
      <div id="joystick-base" class="virtual-joystick-base">
        <div id="joystick-thumb" class="virtual-joystick-thumb"></div>
      </div>

      <!-- Tombol Aksi Kanan (Lompat Obby & Tembak Jaring Spiderman) -->
      <div class="action-buttons-group">
        <button id="btn-shoot-web" class="action-btn-large btn-web-sling">
          🕸️
          <span>JARING</span>
        </button>
        <button id="btn-hero-jump" class="action-btn-large btn-jump">
          ⬆️
          <span>LOMPAT</span>
        </button>
      </div>
    </div>

    <!-- Zona Tantangan Edukasi Interaktif (Muncul Saat Tiba di Target Gedung/Obby) -->
    <div id="challenge-overlay-card">
      <div class="challenge-speech-bar" id="speech-trigger-box">
        <span class="speech-icon">🔊</span>
        <span class="speech-text" id="challenge-prompt-text">
          Ayo tembak jaring ke huruf A untuk memanjat gedung!
        </span>
      </div>

      <div class="choices-bubble-row" id="choices-container">
        <!-- Pilihan Huruf Kartu di-render dinamis -->
      </div>
    </div>

    <!-- Popup Perayaan Kemenangan Bintang Hero -->
    <div id="celebration-popup" class="hidden">
      <div class="celebration-box">
        <div class="star-hero-big">🦸‍♂️✨</div>
        <h2 style="font-size: 24px; font-weight: 800; color: #ef4444; margin-top: 10px;">HEBAT BANGET!</h2>
        <p id="celebration-detail" style="font-size: 15px; color: #64748b; font-weight: 600; margin-top: 6px;">
          Spider-Hero berhasil memanjat puncak gedung!
        </p>
        <button id="btn-next-mission" class="btn-super-next">Misi Berikutnya! 🚀</button>
      </div>
    </div>

    <!-- Menu Utama Pilihan Dunia -->
    <div id="start-modal-screen">
      <div class="menu-avatar-duo">
        <span>🕷️</span>
        <span>🧱</span>
      </div>
      <h1 class="menu-main-title">Petualangan Hero Kids</h1>
      <p class="menu-main-sub">Spiderman Memanjat Gedung & Obby Roblox Seru</p>

      <div class="mode-cards-container">
        <!-- Mode 1: Spiderman Memanjat Gedung -->
        <button class="btn-card-mode mode-spiderman" data-gamemode="spiderman">
          <span class="card-mode-icon">🕷️</span>
          <div class="card-mode-info">
            <h4>Spider-Hero Panjat Gedung</h4>
            <p>Tembak jaring laba-laba & panjat menara huruf</p>
          </div>
        </button>

        <!-- Mode 2: Roblox Obby Parkour -->
        <button class="btn-card-mode mode-roblox" data-gamemode="roblox">
          <span class="card-mode-icon">🧱</span>
          <div class="card-mode-info">
            <h4>Roblox Obby Parkour</h4>
            <p>Lompat platform warna-warni & cari balok huruf</p>
          </div>
        </button>

        <!-- Mode 3: Petualangan Hijaiyah 3D -->
        <button class="btn-card-mode mode-hijaiyah-park" data-gamemode="hijaiyah">
          <span class="card-mode-icon">🕌</span>
          <div class="card-mode-info">
            <h4>Taman Hijaiyah Hero</h4>
            <p>Mengenal huruf Alif sampai Ya di kota suci</p>
          </div>
        </button>
      </div>
    </div>

  </div>

  <!-- ==========================================================================
       SCRIPT ENGINE 3D THREE.JS: SPIDERMAN WEB-SLINGING, ROBLOX OBBY & AUDIO
       ========================================================================== -->
  <script>
    (function() {
      'use strict';

      // ----------------------------------------------------------------------
      // 1. DATA MISI EDUKASI SPIDERMAN, ROBLOX & HIJAIYAH
      // ----------------------------------------------------------------------
      const SPIDER_MISSIONS = [
        { letter: 'A', name: 'A', word: 'Apel', desc: 'A untuk Apel Merah! Tembak jaring ke huruf A!' },
        { letter: 'B', name: 'B', word: 'Bola', desc: 'B untuk Bola Bundar! Tembak jaring ke huruf B!' },
        { letter: 'C', name: 'C', word: 'Ceri', desc: 'C untuk Ceri Manis! Tembak jaring ke huruf C!' },
        { letter: 'D', name: 'D', word: 'Donat', desc: 'D untuk Donat Cokelat! Tembak jaring ke huruf D!' },
        { letter: 'E', name: 'E', word: 'Elang', desc: 'E untuk Elang Terbang! Tembak jaring ke huruf E!' },
        { letter: 'F', name: 'F', word: 'Flamingo', desc: 'F untuk Flamingo Cantik! Tembak jaring ke huruf F!' }
      ];

      const ROBLOX_OBBY_MISSIONS = [
        { letter: 'G', name: 'G', word: 'Gajah', desc: 'Lompat ke platform balok huruf G!' },
        { letter: 'H', name: 'H', word: 'Harimau', desc: 'Lompat ke platform balok huruf H!' },
        { letter: 'I', name: 'I', word: 'Ikan', desc: 'Lompat ke platform balok huruf I!' },
        { letter: 'J', name: 'J', word: 'Jerapah', desc: 'Lompat ke platform balok huruf J!' },
        { letter: 'K', name: 'K', word: 'Kelinci', desc: 'Lompat ke platform balok huruf K!' },
        { letter: 'L', name: 'L', word: 'Lumba-lumba', desc: 'Lompat ke platform balok huruf L!' }
      ];

      const HIJAIYAH_MISSIONS = [
        { id: 'alif', arabic: 'ا', name: 'Alif', desc: 'Tegak lurus seperti tiang! Tembak jaring ke huruf Alif!' },
        { id: 'ba', arabic: 'ب', name: 'Ba', desc: 'Ada satu titik di bawah perahu! Cari huruf Ba!' },
        { id: 'ta', arabic: 'ت', name: 'Ta', desc: 'Ada dua titik mata di atas perahu! Cari huruf Ta!' },
        { id: 'tsa', arabic: 'ث', name: 'Tsa', desc: 'Ada tiga titik bintang di atas! Cari huruf Tsa!' },
        { id: 'jim', arabic: 'ج', name: 'Jim', desc: 'Ada satu titik di dalam perutnya! Cari huruf Jim!' },
        { id: 'ha', arabic: 'ح', name: 'Ha', desc: 'Bersih tanpa titik! Cari huruf Ha!' }
      ];

      // ----------------------------------------------------------------------
      // 2. SISTEM SUARA & EFEK SFX WEB-SLINGING & JUMP
      // ----------------------------------------------------------------------
      class SoundEngine {
        constructor() {
          this.synth = window.speechSynthesis || null;
          this.audioCtx = null;
          this.lastSpeech = '';
          this.unlocked = false;
          this.initVoice();
        }

        unlock() {
          if (this.unlocked) return;
          try {
            const ACtx = window.AudioContext || window.webkitAudioContext;
            if (ACtx) {
              this.audioCtx = new ACtx();
              if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            }
            if (this.synth) this.synth.speak(new SpeechSynthesisUtterance(''));
            this.unlocked = true;
          } catch(e) {}
        }

        initVoice() {
          if (!this.synth) return;
          const setV = () => {
            const voices = this.synth.getVoices() || [];
            this.idVoice = voices.find(v => v.lang && (v.lang.includes('id') || v.lang.includes('ID'))) || null;
          };
          setV();
          if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = setV;
          }
        }

        speak(text, onEnd) {
          if (!text) { if (onEnd) onEnd(); return; }
          this.lastSpeech = text;
          if (!this.synth) { if (onEnd) setTimeout(onEnd, 1000); return; }

          try { this.synth.cancel(); } catch(e) {}
          try {
            const utter = new SpeechSynthesisUtterance(text);
            if (this.idVoice) utter.voice = this.idVoice;
            utter.lang = 'id-ID';
            utter.rate = 0.9;
            utter.pitch = 1.25;
            utter.onend = () => { if (onEnd) onEnd(); };
            utter.onerror = () => { if (onEnd) onEnd(); };
            this.synth.speak(utter);
          } catch(e) {
            if (onEnd) onEnd();
          }
        }

        repeat() {
          if (this.lastSpeech) {
            this.playTap();
            this.speak(this.lastSpeech);
          }
        }

        _getCtx() {
          if (!this.audioCtx) {
            const ACtx = window.AudioContext || window.webkitAudioContext;
            if (ACtx) this.audioCtx = new ACtx();
          }
          if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();
          return this.audioCtx;
        }

        // Efek Suara Tembak Jaring Spiderman (Thwip!)
        playWebThwip() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(2200, t + 0.12);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.14);
          } catch(e) {}
        }

        // Efek Suara Lompat Obby Roblox (Boing!)
        playJumpBoing() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(240, t);
            osc.frequency.exponentialRampToValueAtTime(600, t + 0.15);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.16);
          } catch(e) {}
        }

        // Efek Kemenangan
        playVictory() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
              const osc = c.createOscillator();
              const gain = c.createGain();
              const st = t + idx * 0.08;
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, st);
              gain.gain.setValueAtTime(0.25, st);
              gain.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
              osc.connect(gain);
              gain.connect(c.destination);
              osc.start(st);
              osc.stop(st + 0.35);
            });
          } catch (e) {}
        }

        playTap() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, t);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.05);
          } catch(e) {}
        }

        playSoftTryAgain() {
          const c = this._getCtx();
          if (!c) return;
          try {
            const t = c.currentTime;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.linearRampToValueAtTime(320, t + 0.2);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t);
            osc.stop(t + 0.25);
          } catch (e) {}
        }
      }

      const sounds = new SoundEngine();

      // ----------------------------------------------------------------------
      // 3. ENGINE 3D TAMPILAN SPIDERMAN & ROBLOX OBBY (THREE.JS)
      // ----------------------------------------------------------------------
      class ThreeDWorldManager {
        constructor(canvas) {
          this.canvas = canvas;
          this.scene = null;
          this.camera = null;
          this.renderer = null;

          // Karakter 3D
          this.characterGroup = null;
          this.characterType = 'spiderman'; // 'spiderman' atau 'roblox'
          this.charPos = { x: 0, y: 0.8, z: 0 };
          this.charVelocity = { x: 0, y: 0, z: 0 };
          this.isClimbing = false;
          this.isJumping = false;

          // Jaring Laba-laba 3D (Cylinder / Line)
          this.webLine = null;

          // Gedung & Balok Obby
          this.environmentGroup = new THREE.Group();

          this.initThree();
          this.animate = this.animate.bind(this);
          requestAnimationFrame(this.animate);
        }

        initThree() {
          const width = window.innerWidth;
          const height = window.innerHeight;

          this.scene = new THREE.Scene();
          this.scene.background = new THREE.Color('#38bdf8'); // Langit cerah

          this.camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
          this.camera.position.set(0, 5, 11);
          this.camera.lookAt(0, 2, 0);

          this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
          this.renderer.setSize(width, height);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

          // Pencahayaan Ceria
          const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
          hemiLight.position.set(0, 20, 0);
          this.scene.add(hemiLight);

          const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
          dirLight.position.set(10, 20, 10);
          this.scene.add(dirLight);

          this.scene.add(this.environmentGroup);

          this.buildCharacter('spiderman');
          this.buildCityEnvironment();

          window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            this.camera.aspect = w / h;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(w, h);
          });
        }

        // ================= DESAIN KARAKTER 3D ================= //
        buildCharacter(type) {
          if (this.characterGroup) this.scene.remove(this.characterGroup);
          this.characterType = type;
          this.characterGroup = new THREE.Group();

          if (type === 'spiderman') {
            // SPIDERMAN 3D (Setelan Merah & Biru Kartun)
            // Badan
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.0, 0.5);
            const redMat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
            const blueMat = new THREE.MeshLambertMaterial({ color: 0x1d4ed8 });
            const spideyBody = new THREE.Mesh(bodyGeo, redMat);
            spideyBody.position.y = 0.5;
            this.characterGroup.add(spideyBody);

            // Kepala dengan Topeng Spiderman
            const headGeo = new THREE.SphereGeometry(0.45, 16, 16);
            const head = new THREE.Mesh(headGeo, redMat);
            head.position.y = 1.35;
            this.characterGroup.add(head);

            // Mata Putih Spiderman
            const eyeGeo = new THREE.BoxGeometry(0.18, 0.1, 0.05);
            const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const leftEye = new THREE.Mesh(eyeGeo, whiteMat);
            leftEye.position.set(-0.16, 1.35, 0.42);
            leftEye.rotation.z = 0.2;
            const rightEye = new THREE.Mesh(eyeGeo, whiteMat);
            rightEye.position.set(0.16, 1.35, 0.42);
            rightEye.rotation.z = -0.2;
            this.characterGroup.add(leftEye, rightEye);

            // Kaki Biru
            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.35);
            const leftLeg = new THREE.Mesh(legGeo, blueMat);
            leftLeg.position.set(-0.25, -0.4, 0);
            const rightLeg = new THREE.Mesh(legGeo, blueMat);
            rightLeg.position.set(0.25, -0.4, 0);
            this.characterGroup.add(leftLeg, rightLeg);

          } else {
            // ROBLOX NOOB AVATAR (Kuning, Biru, Hijau Roblox Klasik)
            const yellowMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
            const blueMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
            const greenMat = new THREE.MeshLambertMaterial({ color: 0x22c55e });

            // Kepala Kotak Kuning Roblox
            const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            const head = new THREE.Mesh(headGeo, yellowMat);
            head.position.y = 1.45;
            this.characterGroup.add(head);

            // Badan Kotak Biru Roblox
            const bodyGeo = new THREE.BoxGeometry(1.0, 1.0, 0.5);
            const robloxBody = new THREE.Mesh(bodyGeo, blueMat);
            robloxBody.position.y = 0.5;
            this.characterGroup.add(robloxBody);

            // Kaki Hijau Roblox
            const legGeo = new THREE.BoxGeometry(0.45, 0.9, 0.45);
            const leftLeg = new THREE.Mesh(legGeo, greenMat);
            leftLeg.position.set(-0.26, -0.45, 0);
            const rightLeg = new THREE.Mesh(legGeo, greenMat);
            rightLeg.position.set(0.26, -0.45, 0);
            this.characterGroup.add(leftLeg, rightLeg);
          }

          this.characterGroup.position.set(this.charPos.x, this.charPos.y, this.charPos.z);
          this.scene.add(this.characterGroup);
        }

        // ================= KOTA GEDUNG SPIDERMAN & OBBY ROBLOX ================= //
        buildCityEnvironment() {
          while (this.environmentGroup.children.length > 0) {
            this.environmentGroup.remove(this.environmentGroup.children[0]);
          }

          // Lantai Jalan / Rumput Luas
          const groundGeo = new THREE.PlaneGeometry(80, 80);
          groundGeo.rotateX(-Math.PI / 2);
          const groundMat = new THREE.MeshLambertMaterial({ color: 0x86efac });
          const ground = new THREE.Mesh(groundGeo, groundMat);
          ground.position.y = -0.5;
          this.environmentGroup.add(ground);

          if (this.characterType === 'spiderman') {
            // GEDUNG MENARA BESAR UNTUK DIPANJAT
            const towerGeo = new THREE.BoxGeometry(5, 16, 5);
            const towerMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
            const tower = new THREE.Mesh(towerGeo, towerMat);
            tower.position.set(0, 7.5, -4);
            this.environmentGroup.add(tower);

            // Jendela-jendela Gedung Bercahaya
            for (let y = 1; y < 14; y += 2) {
              for (let x = -1.6; x <= 1.6; x += 1.6) {
                const winGeo = new THREE.PlaneGeometry(0.8, 1.0);
                const winMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
                const win = new THREE.Mesh(winGeo, winMat);
                win.position.set(x, y, -1.48);
                this.environmentGroup.add(win);
              }
            }

            // Target Bintang Emas di Puncak Gedung
            const starGeo = new THREE.OctahedronGeometry(0.8);
            const starMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            this.goalStar = new THREE.Mesh(starGeo, starMat);
            this.goalStar.position.set(0, 16.5, -4);
            this.environmentGroup.add(this.goalStar);

          } else {
            // ROBLOX OBBY PARKOUR (PLATFORM BALOK WARNA-WARNI MELAYANG)
            const colors = [0xef4444, 0xf59e0b, 0x10b981, 0x3b82f6, 0x8b5cf6];
            for (let i = 0; i < 7; i++) {
              const platGeo = new THREE.BoxGeometry(2.5, 0.4, 2.5);
              const platMat = new THREE.MeshLambertMaterial({ color: colors[i % colors.length] });
              const plat = new THREE.Mesh(platGeo, platMat);
              plat.position.set((i % 2 === 0 ? 1 : -1) * 1.5, i * 1.6, -i * 2.5);
              this.environmentGroup.add(plat);
            }
          }
        }

        // ================= TEMBAK JARING & PANJAT GEDUNG ================= //
        shootWebAndClimb(onClimbed) {
          sounds.playWebThwip();
          this.isClimbing = true;

          // Buat Tali Jaring Laba-Laba
          if (this.webLine) this.scene.remove(this.webLine);
          const points = [];
          points.push(new THREE.Vector3(this.characterGroup.position.x, this.characterGroup.position.y + 1, this.characterGroup.position.z));
          points.push(new THREE.Vector3(0, 15, -4)); // Menancap ke puncak gedung
          const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
          const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 4 });
          this.webLine = new THREE.Line(lineGeo, lineMat);
          this.scene.add(this.webLine);

          // Animasi Karakter Terangkat Melayang ke Atas
          const climbInterval = setInterval(() => {
            if (this.characterGroup.position.y < 15) {
              this.characterGroup.position.y += 0.4;
              this.characterGroup.position.z -= 0.08;
              this.characterGroup.rotation.y += 0.2; // Gaya akrobatik spiderman berputar
              this.camera.position.y = this.characterGroup.position.y + 4;
            } else {
              clearInterval(climbInterval);
              this.isClimbing = false;
              if (this.webLine) {
                this.scene.remove(this.webLine);
                this.webLine = null;
              }
              if (onClimbed) onClimbed();
            }
          }, 30);
        }

        jumpAction() {
          if (this.isJumping || this.isClimbing) return;
          sounds.playJumpBoing();
          this.isJumping = true;
          let jumpVelocity = 0.35;

          const jumpLoop = setInterval(() => {
            this.characterGroup.position.y += jumpVelocity;
            jumpVelocity -= 0.03;
            if (this.characterGroup.position.y <= 0.8) {
              this.characterGroup.position.y = 0.8;
              this.isJumping = false;
              clearInterval(jumpLoop);
            }
          }, 30);
        }

        resetCharacterPosition() {
          this.characterGroup.position.set(0, 0.8, 0);
          this.characterGroup.rotation.set(0, 0, 0);
          this.camera.position.set(0, 5, 11);
          this.camera.lookAt(0, 2, 0);
        }

        animate() {
          requestAnimationFrame(this.animate);

          // Animasi Putar Bintang Emas Puncak
          if (this.goalStar) {
            this.goalStar.rotation.y += 0.03;
            this.goalStar.rotation.x += 0.02;
          }

          this.renderer.render(this.scene, this.camera);
        }
      }

      // ----------------------------------------------------------------------
      // 4. LOGIKA PERMAINAN UTAMA (SPIDER-HERO & ROBLOX CONTROLLER)
      // ----------------------------------------------------------------------
      class SuperheroGameApp {
        constructor() {
          this.world3D = null;
          this.activeMode = 'spiderman'; // 'spiderman', 'roblox', 'hijaiyah'
          this.currentMissionIndex = 0;
          this.starScore = 0;
          this.canAnswer = true;

          this.init();
        }

        init() {
          const canvas = document.getElementById('three-canvas');
          this.world3D = new ThreeDWorldManager(canvas);

          this.bindControls();
          this.loadScore();
        }

        loadScore() {
          try {
            const s = localStorage.getItem('spider_kids_stars');
            if (s) this.starScore = parseInt(s, 10) || 0;
            document.getElementById('star-counter').innerText = this.starScore;
          } catch(e) {}
        }

        addScore() {
          this.starScore++;
          try {
            localStorage.setItem('spider_kids_stars', this.starScore);
          } catch(e) {}
          document.getElementById('star-counter').innerText = this.starScore;
        }

        bindControls() {
          // Tombol Pilih Mode di Start Menu
          document.querySelectorAll('.btn-card-mode').forEach(btn => {
            btn.addEventListener('click', (e) => {
              sounds.unlock();
              sounds.playTap();
              const mode = e.currentTarget.getAttribute('data-gamemode');
              document.getElementById('start-modal-screen').classList.add('hidden');
              this.setGameMode(mode);
            });
          });

          // Switch Mode Cepat di Bar Atas
          document.querySelectorAll('.mode-pill-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              sounds.playTap();
              const mode = e.currentTarget.getAttribute('data-mode');
              document.querySelectorAll('.mode-pill-btn').forEach(b => b.classList.remove('active'));
              e.currentTarget.classList.add('active');
              this.setGameMode(mode);
            });
          });

          // Tombol Home
          document.getElementById('btn-back-home')?.addEventListener('click', () => {
            sounds.playTap();
            document.getElementById('start-modal-screen').classList.remove('hidden');
          });

          // Tombol Replay Suara
          document.getElementById('btn-repeat-speech')?.addEventListener('click', () => {
            sounds.repeat();
          });

          document.getElementById('speech-trigger-box')?.addEventListener('click', () => {
            sounds.repeat();
          });

          // Tombol Aksi Tembak Jaring Spiderman
          document.getElementById('btn-shoot-web')?.addEventListener('click', () => {
            sounds.playTap();
            if (this.activeMode === 'spiderman') {
              sounds.speak("Jawab huruf yang tepat agar jaring bisa menancap ke puncak gedung!");
            }
          });

          // Tombol Lompat Obby
          document.getElementById('btn-hero-jump')?.addEventListener('click', () => {
            this.world3D.jumpAction();
          });

          // Tombol Lanjut di Popup Menang
          document.getElementById('btn-next-mission')?.addEventListener('click', () => {
            sounds.playTap();
            document.getElementById('celebration-popup').classList.add('hidden');
            this.nextMission();
          });

          // Joystick Sentuh Virtual untuk HP
          this.initJoystick();
        }

        initJoystick() {
          const base = document.getElementById('joystick-base');
          const thumb = document.getElementById('joystick-thumb');
          let isTouching = false;
          let startX = 0, startY = 0;

          const handleStart = (e) => {
            isTouching = true;
            const touch = e.touches ? e.touches[0] : e;
            const rect = base.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
          };

          const handleMove = (e) => {
            if (!isTouching) return;
            const touch = e.touches ? e.touches[0] : e;
            let dx = touch.clientX - startX;
            let dy = touch.clientY - startY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxRadius = 35;

            if (dist > maxRadius) {
              dx = (dx / dist) * maxRadius;
              dy = (dy / dist) * maxRadius;
            }

            thumb.style.transform = `translate(${dx}px, ${dy}px)`;

            // Gerakkan Karakter 3D Secara Halus
            if (this.world3D.characterGroup) {
              this.world3D.characterGroup.position.x += dx * 0.005;
              this.world3D.characterGroup.rotation.y = -Math.atan2(dy, dx) - Math.PI / 2;
            }
          };

          const handleEnd = () => {
            isTouching = false;
            thumb.style.transform = 'translate(0px, 0px)';
          };

          base.addEventListener('touchstart', handleStart, { passive: true });
          window.addEventListener('touchmove', handleMove, { passive: true });
          window.addEventListener('touchend', handleEnd);

          base.addEventListener('mousedown', handleStart);
          window.addEventListener('mousemove', handleMove);
          window.addEventListener('mouseup', handleEnd);
        }

        setGameMode(mode) {
          this.activeMode = mode;
          this.currentMissionIndex = 0;
          this.world3D.buildCharacter(mode === 'roblox' ? 'roblox' : 'spiderman');
          this.world3D.buildCityEnvironment();
          this.world3D.resetCharacterPosition();

          this.loadMission();
        }

        getCurrentList() {
          if (this.activeMode === 'roblox') return ROBLOX_OBBY_MISSIONS;
          if (this.activeMode === 'hijaiyah') return HIJAIYAH_MISSIONS;
          return SPIDER_MISSIONS;
        }

        loadMission() {
          this.canAnswer = true;
          const list = this.getCurrentList();
          const mission = list[this.currentMissionIndex % list.length];
          const isHijaiyah = (this.activeMode === 'hijaiyah');

          // Buat 3 Pilihan (1 Benar, 2 Pengecoh)
          let choices = [mission];
          let others = list.filter(m => (isHijaiyah ? m.id !== mission.id : m.letter !== mission.letter));
          others.sort(() => Math.random() - 0.5);
          choices.push(others[0], others[1]);
          choices.sort(() => Math.random() - 0.5);

          // Update Teks Instruksi
          const promptEl = document.getElementById('challenge-prompt-text');
          promptEl.innerText = mission.desc;
          sounds.speak(mission.desc);

          // Render Tombol Pilihan Huruf Kartun
          const container = document.getElementById('choices-container');
          container.innerHTML = '';

          choices.forEach(ch => {
            const btn = document.createElement('button');
            btn.className = 'bubble-choice-btn';

            if (isHijaiyah) {
              btn.innerHTML = `
                <span class="choice-main-char arabic">${ch.arabic}</span>
                <span class="choice-sub-text">${ch.name}</span>
              `;
            } else {
              btn.innerHTML = `
                <span class="choice-main-char">${ch.letter}</span>
                <span class="choice-sub-text">${ch.word}</span>
              `;
            }

            btn.addEventListener('click', () => {
              if (!this.canAnswer) return;
              this.handleChoiceAnswer(ch, mission, btn);
            });

            container.appendChild(btn);
          });
        }

        handleChoiceAnswer(selected, target, btnElem) {
          sounds.playTap();
          const isCorrect = (this.activeMode === 'hijaiyah') ? (selected.id === target.id) : (selected.letter === target.letter);

          if (isCorrect) {
            this.canAnswer = false;
            this.addScore();
            btnElem.style.borderColor = '#10b981';
            btnElem.style.background = '#dcfce7';

            if (this.activeMode === 'spiderman' || this.activeMode === 'hijaiyah') {
              // Animasi Spiderman Tembak Jaring & Panjat Gedung ke Puncak!
              this.world3D.shootWebAndClimb(() => {
                this.showCelebrationPopup();
              });
            } else {
              // Mode Roblox Obby: Karakter Melompat Parkour Melewati Balok!
              this.world3D.jumpAction();
              setTimeout(() => {
                this.showCelebrationPopup();
              }, 600);
            }

          } else {
            // Salah Lembut
            sounds.playSoftTryAgain();
            btnElem.style.transform = 'scale(0.88)';
            setTimeout(() => btnElem.style.transform = 'scale(1)', 200);
            sounds.speak("Yuk coba lagi! Cari huruf yang sesuai instruksi ya adik hebat!");
          }
        }

        showCelebrationPopup() {
          sounds.playVictory();
          const popup = document.getElementById('celebration-popup');
          const detail = document.getElementById('celebration-detail');

          if (this.activeMode === 'spiderman') {
            detail.innerText = "Yeeay! Spider-Hero berhasil menembak jaring dan memanjat gedung sampai ke puncak!";
            sounds.speak("Horeee! Spider Hero berhasil memanjat puncak menara! Kamu anak yang sangat hebat!");
          } else if (this.activeMode === 'roblox') {
            detail.innerText = "Keren sekali! Karakter Obby kamu berhasil parkour di platform balok huruf!";
            sounds.speak("Luar biasa! Karakter Roblox kamu berhasil melewati rintangan Obby!");
          } else {
            detail.innerText = "Alhamdulillah! Huruf Hijaiyah berhasil kamu temukan!";
            sounds.speak("Alhamdulillah! Kamu hebat sekali menemukan huruf Hijaiyah!");
          }

          popup.classList.remove('hidden');
        }

        nextMission() {
          this.currentMissionIndex++;
          this.world3D.resetCharacterPosition();
          this.loadMission();
        }
      }

      // Start saat Halaman Siap
      window.addEventListener('DOMContentLoaded', () => {
        window.heroGame = new SuperheroGameApp();
      });

    })();
  </script>
